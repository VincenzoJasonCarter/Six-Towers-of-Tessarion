<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadmint Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3ede1;
  --panel: #fbf8f1;
  --ink: #2a241d;
  --muted: #6f6557;
  --rule: #d8cdb8;
  --accent: #8c2f23;
  --accent-soft: #f1ddd5;
  /* the market hall: plastered walls, a wooden cabinet of shelves under each awning, paper tags on the goods */
  --wall: #e9dcc2;
  --wall-lo: #d9c7a5;
  --lamp: rgb(255 214 140 / .45);
  --tag: #fbf5e6;
  --tag-edge: #d9c9a6;
  --plate: #fffdf7;
  --wood: #6e4526;
  --wood-hi: #93603a;
  --wood-lo: #3b2312;
  --wood-back: #34200f;
  --brass: #d9bb70;
  --brass-lo: #a9843a;
  --brass-ink: #3a2a10;
  --canvas: #f4ead3;
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --display: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
    --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520;
    --wall: #221c15; --wall-lo: #17130e; --lamp: rgb(255 180 90 / .1);
    --tag: #2a241c; --tag-edge: #4a4032; --plate: #efe7d4;
    --wood: #4d311c; --wood-hi: #6b4629; --wood-lo: #1f130a; --wood-back: #1b1109; --canvas: #d9ccb0;
  }
}
:root[data-theme="dark"] {
  --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
  --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520;
  --wall: #221c15; --wall-lo: #17130e; --lamp: rgb(255 180 90 / .1);
  --tag: #2a241c; --tag-edge: #4a4032; --plate: #efe7d4;
  --wood: #4d311c; --wood-hi: #6b4629; --wood-lo: #1f130a; --wood-back: #1b1109; --canvas: #d9ccb0;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
body {
  margin: 0; color: var(--ink); font: 18px/1.6 var(--serif);
  background:
    radial-gradient(ellipse 70% 420px at 50% 0, var(--lamp), transparent 75%),
    repeating-linear-gradient(90deg, transparent 0 119px, rgb(0 0 0 / .035) 119px 121px),
    linear-gradient(180deg, var(--wall), var(--wall-lo));
  background-attachment: fixed;
  min-height: 100vh;
}
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { text-decoration: none; color: var(--ink); margin-right: auto; }
.brand b { font: 700 26px/1 var(--display); letter-spacing: .01em; }
.brand span { display: block; font-size: 13px; color: var(--muted); font-style: italic; }
.search {
  width: min(320px, 100%); padding: 7px 12px; border: 1px solid var(--rule);
  border-radius: 6px; background: var(--bg); font: 15px var(--sans);
}
.tally-btn {
  display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); font: 14px var(--sans); color: var(--muted);
}
.tally-btn b { font-weight: 600; color: var(--ink); }
.tally-btn.has { border-color: var(--brass-lo); background: color-mix(in srgb, var(--brass) 22%, var(--bg)); }
.tally-btn:hover, .tally-btn:focus-visible { border-color: var(--accent); outline: none; }

/* A Crownsblood coin, in brass. */
.coin {
  display: inline-block; flex: none; width: 1.05em; height: 1.05em; border-radius: 50%; vertical-align: -.14em;
  background: radial-gradient(circle at 35% 30%, #fff3c4, var(--brass) 45%, var(--brass-lo) 80%);
  box-shadow: inset 0 0 0 1.5px rgb(90 60 10 / .45), 0 1px 1px rgb(0 0 0 / .25);
}

main { padding: 28px 48px 80px; max-width: 1280px; margin: 0 auto; }

/* ---------- intro and filters ---------- */
.intro { max-width: 780px; }
.kicker { margin: 0; font: 600 12px var(--sans); letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
h1 { font: 700 44px/1.1 var(--display); margin: 4px 0 8px; }
.lead { margin: 0 0 14px; color: var(--muted); }
.filters { display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button {
  border: 1px solid var(--rule); background: var(--panel); border-radius: 999px;
  padding: 3px 12px; font: 13px var(--sans); cursor: pointer; color: var(--muted);
}
.chips button:hover { color: var(--ink); border-color: var(--muted); }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.empty { color: var(--muted); font-style: italic; }
.error { white-space: pre-wrap; padding: 12px 16px; margin-bottom: 20px; border-radius: 6px; font: 14px/1.5 ui-monospace, Consolas, monospace; background: var(--accent-soft); color: var(--accent); }

/* ---------- the stalls ---------- */
/* Each stall is a striped canvas awning over a wooden cabinet of shelves:
   a head board carrying the stall's brass plaque, a back of dark vertical
   boards between two stiles, a fixed board between tiers and a plinth.
   Every tag is exactly --card tall, so each row of goods stands on the next
   plank of the repeating gradient behind it, the full width of the cabinet. */
.stall { margin-top: 44px; --awn: #9b3a2a; --stile: 16px; --inset: 30px; --card: 298px; --head: 24px; --plank: 18px; }
.stall[data-stall="armour"] { --awn: #3d5f86; }
.stall[data-stall="provisions"] { --awn: #4f7a45; }
.stall[data-stall="stock"] { --awn: #7a5530; }
.stall[data-stall="workshop"] { --awn: #4f5963; }
.stall[data-stall="other"] { --awn: #6f6557; }
.awning {
  position: relative; z-index: 3; height: 34px; border-radius: 4px 4px 0 0;
  background: repeating-linear-gradient(90deg, var(--awn) 0 34px, var(--canvas) 34px 68px);
  box-shadow: inset 0 -6px 8px -4px rgb(0 0 0 / .25);
  /* the scalloped hem */
  -webkit-mask: radial-gradient(circle 17px at 17px 17px, #000 98%, transparent) 0 17px / 34px 34px repeat-x, linear-gradient(#000, #000) 0 0 / 100% 17px no-repeat;
  mask: radial-gradient(circle 17px at 17px 17px, #000 98%, transparent) 0 17px / 34px 34px repeat-x, linear-gradient(#000, #000) 0 0 / 100% 17px no-repeat;
  filter: drop-shadow(0 4px 4px rgb(0 0 0 / .3));
}
.cabinet {
  position: relative; margin: -17px 12px 0; padding: 0 var(--inset);
  border-bottom: 20px solid var(--wood);
  background:
    linear-gradient(180deg, rgb(0 0 0 / .35), transparent 120px),
    repeating-linear-gradient(90deg, transparent 0 94px, rgb(0 0 0 / .4) 94px 96px, rgb(255 255 255 / .04) 96px 97px),
    var(--wood-back);
  box-shadow: 0 18px 22px -12px rgb(0 0 0 / .55), inset 0 -6px 10px -6px rgb(0 0 0 / .6);
}
.cabinet::before, .cabinet::after { /* the stiles, in front of the shelves */
  content: ""; position: absolute; top: 0; bottom: 0; z-index: 2; width: var(--stile);
  background: linear-gradient(90deg, var(--wood-hi), var(--wood) 45%, var(--wood-lo));
  box-shadow: 0 0 0 1px rgb(0 0 0 / .3);
}
.cabinet::before { left: 0; }
.cabinet::after { right: 0; transform: scaleX(-1); }
.cabinet-head {
  position: relative; z-index: 1; margin: 0 calc(-1 * var(--inset)); padding: 26px 20px 12px; text-align: center;
  background:
    linear-gradient(180deg, transparent calc(100% - 6px), rgb(0 0 0 / .35) calc(100% - 6px)),
    linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, color-mix(in srgb, var(--wood) 75%, black));
  box-shadow: 0 8px 12px -4px rgb(0 0 0 / .6);
}
.stall h2 { margin: 0; font: 700 21px/1 var(--display); display: flex; justify-content: center; }
.stall h2 span {
  padding: 6px 18px 5px; border-radius: 3px; color: var(--brass-ink); letter-spacing: .03em; white-space: nowrap;
  background:
    radial-gradient(circle, #7a5a22 0 1.6px, transparent 2.2px) 5px 50% / 6px 6px no-repeat,
    radial-gradient(circle, #7a5a22 0 1.6px, transparent 2.2px) calc(100% - 5px) 50% / 6px 6px no-repeat,
    linear-gradient(180deg, #f0d997, var(--brass) 45%, var(--brass-lo));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .2), 0 2px 5px rgb(0 0 0 / .45);
}
.blurb { margin: 8px 0 0; font-style: italic; color: #ecd9b0; font-size: 15.5px; text-shadow: 0 1px 1px rgb(0 0 0 / .5); }

/* Each tier has a shelf of its own, named on a plate in its metal: bronze
   for Tier I, steel for Tier II, plain paper for untiered supplies. The same
   colour runs along the top of every tag on it. A thicker fixed board
   separates one tier's shelf from the next. */
.shelf { --tier: #d8c9a6; --tier-lo: #a8956c; --tier-ink: #4a3b22; }
.shelf[data-tier="1"], .item[data-tier="1"] { --tier: #d9955a; --tier-lo: #8f5426; --tier-ink: #2e1a08; }
.shelf[data-tier="2"], .item[data-tier="2"] { --tier: #b9c8d6; --tier-lo: #5f7184; --tier-ink: #17222e; }
.shelf + .shelf {
  margin: 0 calc(-1 * var(--inset)); padding: 0 var(--inset);
  border-top: 16px solid var(--wood); box-shadow: inset 0 10px 12px -6px rgb(0 0 0 / .65);
}
.tier-plate { margin: 0; padding-top: 18px; position: relative; z-index: 1; font: 700 13.5px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; }
.tier-plate span {
  display: inline-block; padding: 7px 18px 6px; border-radius: 3px; color: var(--tier-ink);
  background:
    radial-gradient(circle, rgb(0 0 0 / .35) 0 1.5px, transparent 2px) 5px 50% / 5px 5px no-repeat,
    radial-gradient(circle, rgb(0 0 0 / .35) 0 1.5px, transparent 2px) calc(100% - 5px) 50% / 5px 5px no-repeat,
    linear-gradient(180deg, color-mix(in srgb, var(--tier) 55%, #fff), var(--tier) 50%, var(--tier-lo));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .2), 0 2px 5px rgb(0 0 0 / .5);
}
.tier-pill {
  display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: 999px; font: 700 9.5px/1.4 var(--sans); font-style: normal; letter-spacing: .06em;
  color: var(--tier-ink); background: var(--tier); box-shadow: inset 0 0 0 1px var(--tier-lo);
}
.item[data-tier="1"] .item-link, .item[data-tier="2"] .item-link { border-top: 5px solid var(--tier); }

.items {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); grid-auto-rows: var(--card);
  column-gap: 22px; row-gap: calc(var(--plank) + var(--head));
  margin: 0 calc(-1 * var(--inset)); padding: var(--head) calc(var(--inset) + 6px) var(--plank);
  background: repeating-linear-gradient(180deg,
    transparent 0 calc(var(--head) + var(--card)),
    color-mix(in srgb, var(--wood-hi) 80%, white) calc(var(--head) + var(--card)),
    var(--wood-hi) calc(var(--head) + var(--card) + 5px),
    var(--wood) calc(var(--head) + var(--card) + 6px),
    var(--wood-lo) calc(var(--head) + var(--card) + var(--plank)));
}
.item { position: relative; display: flex; min-width: 0; }
.item-link {
  position: relative; flex: 1; display: flex; flex-direction: column; align-items: stretch; min-width: 0; overflow: hidden;
  padding: 10px 14px 12px; text-decoration: none; color: var(--ink);
  background: var(--tag); border: 1px solid var(--tag-edge); border-radius: 6px 6px 3px 3px;
  box-shadow: 0 2px 0 rgb(0 0 0 / .25), 8px 6px 12px -6px rgb(0 0 0 / .7);
  transition: transform .2s ease, box-shadow .2s;
}
.item-link:hover, .item-link:focus-visible { transform: translateY(-5px); box-shadow: 0 7px 0 -2px rgb(0 0 0 / .2), 8px 16px 18px -10px rgb(0 0 0 / .8); outline: none; border-color: var(--accent); }

.plate {
  display: grid; place-items: center; height: 104px; margin-top: 4px; border-radius: 4px;
  background: var(--plate); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .06);
}
.plate img { width: 92px; height: 92px; display: block; object-fit: contain; }
.plate .emoji { font-size: 46px; line-height: 1; filter: saturate(.85); }
.tag-body { display: flex; flex-direction: column; gap: 2px; padding: 10px 2px 8px; flex: 1; min-height: 0; overflow: hidden; }
.cat { font: 600 10.5px/1.3 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tag-body b { font: 700 21px/1.12 var(--display); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.stat { font: 12.5px/1.4 var(--sans); color: var(--muted); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.price {
  display: flex; align-items: center; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--tag-edge);
  font: 700 15px var(--sans); color: var(--ink); padding-right: 38px;
}
.unpriced .price { font-weight: 500; font-size: 13px; color: var(--muted); font-style: italic; }
.add {
  position: absolute; right: 10px; bottom: 8px; z-index: 1; width: 30px; height: 30px; padding: 0 0 2px;
  border: 1px solid var(--brass-lo); border-radius: 50%; cursor: pointer;
  font: 600 20px/1 var(--sans); color: var(--brass-ink);
  background: linear-gradient(180deg, #f0d997, var(--brass) 55%, var(--brass-lo));
  box-shadow: 0 2px 4px rgb(0 0 0 / .25);
}
.add:hover, .add:focus-visible { filter: brightness(1.08); outline: 2px solid var(--accent); outline-offset: 2px; }
.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); } }

.notes { margin-top: 56px; padding: 12px 16px; border: 1px dashed var(--muted); border-radius: 6px; background: var(--panel); font: 14px/1.5 var(--sans); }
.notes summary { cursor: pointer; font-weight: 600; }
.notes ul { margin: 6px 0 0; padding-left: 20px; }

/* ---------- dialogs: an item's slip, and the tally ---------- */
dialog {
  padding: 0; border: 0; border-radius: 10px; overflow: hidden;
  background: var(--panel); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / .5);
}
dialog[open] { display: flex; flex-direction: column; animation: rise .22s ease-out; }
dialog::backdrop { background: rgb(20 14 8 / .55); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.close {
  flex: none; display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
  border: 1px solid var(--rule); border-radius: 50%; background: var(--bg); color: var(--muted); cursor: pointer;
}
.close svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; fill: none; }
.close:hover, .close:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 6px;
  padding: 8px 18px; font: 600 15px var(--sans); cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }

.slip { width: min(680px, calc(100vw - 32px)); max-height: min(88dvh, 920px); }
.slip-head {
  display: flex; align-items: flex-start; gap: 18px; padding: 18px 22px 14px;
  border-top: 4px solid var(--accent); border-bottom: 1px solid var(--rule);
}
.plate.big { flex: none; width: 120px; height: 112px; margin: 0; }
.plate.big img { width: 104px; height: 104px; }
.slip-title { flex: 1; min-width: 0; }
.slip-title h2 { margin: 2px 0 2px; font: 700 32px/1.05 var(--display); }
.slip-price { margin: 0; display: flex; align-items: center; gap: 7px; font: 700 18px var(--sans); }
.slip-price .muted { font: italic 500 14px var(--sans); }
.slip-body { overflow-y: auto; padding: 4px 22px 16px; font-size: 17px; line-height: 1.55; }
.slip-body h3 { font: 700 20px/1.2 var(--display); margin: 18px 0 4px; color: var(--accent); }
.slip-body p { margin: 8px 0; }
.statline { font: 15px/1.5 var(--sans); }
.props { display: flex; flex-wrap: wrap; gap: 5px; }
.props span { padding: 0 9px; border-radius: 999px; font: 600 11px/1.9 var(--sans); letter-spacing: .05em; text-transform: uppercase; background: var(--bg); border: 1px solid var(--rule); color: var(--muted); }
.power { padding: 8px 12px; border-left: 3px solid var(--brass-lo); background: color-mix(in srgb, var(--brass) 12%, transparent); border-radius: 0 6px 6px 0; }
table { border-collapse: collapse; width: 100%; font: 14.5px/1.4 var(--sans); }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; }
th { font: 600 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
tfoot td { font-weight: 700; border-bottom: 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 10px 0 0; font: 14.5px/1.5 var(--sans); }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; }
.note { font: 14.5px/1.5 var(--sans); color: var(--muted); }
.uses { margin: 4px 0; padding-left: 20px; }
.slip-foot { display: flex; align-items: center; gap: 14px; padding: 12px 22px; border-top: 1px solid var(--rule); font: 14px var(--sans); }

.tally { width: min(520px, calc(100vw - 32px)); max-height: min(88dvh, 900px); }
.tally-head {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  padding: 18px 22px 12px; border-bottom: 1px solid var(--rule); border-top: 4px solid var(--brass-lo);
}
.tally-head h2 { margin: 2px 0 0; font: 700 30px/1.1 var(--display); }
.tally-body { overflow-y: auto; padding: 8px 22px 20px; font: 15px/1.5 var(--sans); }
.lines td { padding: 8px 4px; }
.plate.tiny { width: 40px; height: 36px; margin: 0; }
.plate.tiny img { width: 34px; height: 34px; }
.plate.tiny .emoji { font-size: 20px; }
.what small { display: block; color: var(--muted); font-size: 12.5px; }
.qty { white-space: nowrap; }
.qty span { display: inline-block; min-width: 2ch; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.qty button {
  width: 26px; height: 26px; padding: 0; border: 1px solid var(--rule); border-radius: 50%;
  background: var(--bg); cursor: pointer; line-height: 1;
}
.qty button:hover, .qty button:focus-visible { border-color: var(--accent); color: var(--accent); outline: none; }
.sum { display: flex; justify-content: space-between; margin: 12px 0 4px; }
.sum dt { color: var(--muted); }
.sum dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.market-kind { display: flex; gap: 6px; margin-top: 12px; }
.market-kind label {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 10px; cursor: pointer;
  border: 1px solid var(--rule); border-radius: 6px; font-size: 14px;
}
.market-kind label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.market-kind input { accent-color: var(--accent); margin: 0; }
.rule { margin: 6px 0; font-size: 13.5px; color: var(--muted); }
.local { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.local label { display: flex; flex-direction: column; gap: 3px; }
.local select, .local input[type="number"] { padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); font: 14px var(--sans); color: var(--ink); }
.local input[type="number"] { width: 90px; }
.local .check { grid-column: 1 / -1; flex-direction: row; align-items: center; gap: 8px; }
.local .check input { accent-color: var(--accent); margin: 0; }
.due {
  display: flex; align-items: center; justify-content: space-between; margin: 12px 0; padding: 10px 14px;
  border-radius: 6px; background: color-mix(in srgb, var(--brass) 18%, var(--bg)); border: 1px solid var(--brass-lo);
}
.due span { font-weight: 600; }
.due b { display: flex; align-items: center; gap: 8px; font: 700 26px/1 var(--display); }
.paying { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.paying select { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); font: 14px var(--sans); }
.tally-actions { display: flex; gap: 10px; margin-top: 16px; }

/* ---------- narrow screens ---------- */
@media (max-width: 760px) {
  .top { padding: 10px 16px; }
  .brand b { font-size: 22px; }
  .search { order: 3; width: 100%; }
  .tally-btn span { display: none; }
  main { padding: 20px 16px 60px; }

  guild: { name: "Guild market", rule: "The total is rounded to the nearest CB, halves up, and every purchase costs at least 1 CB.",
    round: x => x > 0 ? Math.max(1, Math.floor(x + .5)) : 0 },
  local: { name: "Local market", rule: "The Official Value times the markup, always rounded up. A markup can be haggled down (never below × 1), or raised by insult or an obvious need.",
    round: x => Math.ceil(x - 1e-9) },
};
const LOCAL = [
  ["loft", "Loft Market", 2],
  ["street", "Street stall", 3],
  ["frontier", "Frontier trader", 4],
  ["underweave", "Underweave outlet", 5],
];
const SCARCE = 2;  // goods the region has to bring in from elsewhere

const state = { q: "", stall: "all", tier: "all" };
let tally = load("market.tally", {});
let market = MARKETS[storage("market.kind")] ? storage("market.kind") : "guild";
let local = { kind: "street", markup: 3, scarce: false, ...load("market.local", {}) };
let coin = COINS.some(c => c[0] === storage("market.coin")) ? storage("market.coin") : "Crownsblood";

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Prices to two places at most, without trailing zeros: 1, 0.3, 1.15.
const num = n => String(+(+n).toFixed(2));
const cb = n => n == null ? "—" : `${num(n)} CB`;
const cents = n => Math.round(n * 100) / 100;
const tierOf = item => +(String(item.category || "").match(/Tier (\d+)/) || [])[1] || null;
const ROMAN = ["", "I", "II", "III", "IV", "V", "VI"];
// An untiered shelf is named by its stall ("Tools & Hire"), or "Supplies".
const tierName = (t, stall) => t ? `Tier ${ROMAN[t] || t}` : (stall && stall.untiered) || "Supplies";
// "Tier 2 Armor" on a tag that already shows its tier reads as just "Armor".
const kindOf = item => String(item.category || "").replace(/^Tier \d+\s*/, "");
const hours = h => h % 24 === 0 ? `${h / 24} day${h === 24 ? "" : "s"}` : `${h} hour${h === 1 ? "" : "s"}`;

function storage(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (_) { return null; }
}
function load(key, fallback) {
  try { return JSON.parse(storage(key)) || fallback; } catch (_) { return fallback; }
}

function picture(item, cls = "plate") {
  const inner = item.image
    ? `<img src="${esc(item.image)}" alt="" loading="lazy">`
    : `<span class="emoji">${esc(item.emoji || EMOJI[item.kind] || "📦")}</span>`;
  return `<span class="${cls}">${inner}</span>`;
}

// What an item's materials cost bought at the market; `missing` lists any
// the market doesn't price, which leaves the total short.
function recipeCost(item) {
  let cost = 0;
  const missing = [];
  for (const [name, qty] of item.materials || []) {
    const m = byName[name];
    if (!m || m.market_value == null) missing.push(name);
    else cost += m.market_value * qty;
  }
  return { cost: cents(cost), missing };
}

// The items whose recipes use this one, and those it upgrades into.
const usedIn = item => items.filter(i => (i.materials || []).some(([n]) => n === item.name));
const upgradesTo = item => items.filter(i => i.upgrade_from === item.name);
// The recipes a set of tools works: those whose tools line names it.
const worksWith = item => item.kind === "tool" ? items.filter(i => (i.tools || "").toLowerCase().includes(item.name.toLowerCase())) : [];

function haystack(i) {
  return [i.name, i.category, i.kind, i.stat, i.power, i.tools, ...(i.properties || []), ...(i.materials || []).map(m => m[0])]
    .filter(Boolean).join(" ").toLowerCase();
}
items.forEach(i => { i._hay = haystack(i); });

/* ---------- the market floor ---------- */

function chips(name, options, current) {
  return `<div class="chips" role="group" aria-label="${esc(name)}">${options.map(([v, label]) =>
    `<button type="button" data-${name}="${esc(v)}" aria-pressed="${String(v) === String(current)}">${esc(label)}</button>`).join("")}</div>`;
}

function card(item) {
  const priced = item.market_value != null;
  const tier = tierOf(item);
  return `<article class="item${priced ? "" : " unpriced"}" data-tier="${tier || 0}">
    <a class="item-link" href="#${esc(item.id)}" data-open="${esc(item.id)}">
      ${picture(item)}
      <span class="tag-body">
        <small class="cat">${tier ? `<i class="tier-pill">T${tier}</i>` : ""}${esc(kindOf(item))}</small>
        <b>${esc(item.name)}</b>
        ${item.stat ? `<span class="stat">${esc(item.stat)}</span>` : ""}
      </span>
      <span class="price">${priced ? `<i class="coin" aria-hidden="true"></i>${esc(cb(item.market_value))}` : "Not stocked"}</span>
    </a>
    ${priced ? `<button class="add" type="button" data-add="${esc(item.id)}" aria-label="Add ${esc(item.name)} to the tally" title="Add to the tally">+</button>` : ""}
  </article>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const shown = items.filter(i =>
    (state.stall === "all" || stallOf(i).id === state.stall) &&
    (state.tier === "all" || tierOf(i) === +state.tier) &&
    (!q || q.split(/\s+/).every(w => i._hay.includes(w))));
  const tiers = [...new Set(items.map(tierOf).filter(Boolean))].sort();
  const stalls = [...STALLS, OTHER].filter(s => items.some(i => stallOf(i) === s));

  let h = DATA.error ? `<div class="error">${esc(DATA.error)}\n\nFix the file and save; this page reloads itself.</div>` : "";
  h += `<section class="intro">
    <p class="kicker">Merchant's Guild of Tessarion · Chartered Stall</p>
    <h1>The Threadmint Market</h1>
    <p class="lead">Every price on these tags is the Official Tessarion Market Value, set by the Merchant's Guild and paid in
    Crownsblood (CB). Open a tag for the item's rules and recipe, or add it to the tally to price a purchase the way the Guild's clerks would.</p>
    <div class="filters">
      ${chips("stall", [["all", "All stalls"], ...stalls.map(s => [s.id, s.name])], state.stall)}
      ${tiers.length > 1 ? chips("tier", [["all", "All tiers"], ...tiers.map(t => [t, `Tier ${t}`])], state.tier) : ""}
    </div>
  </section>`;

  for (const s of stalls) {
    const here = shown.filter(i => stallOf(i) === s).sort((a, b) => (tierOf(a) || 99) - (tierOf(b) || 99) || items.indexOf(a) - items.indexOf(b));
    if (!here.length) continue;
    // One shelf per tier, lowest first, with untiered supplies last.
    const tiers = [...new Set(here.map(tierOf))].sort((a, b) => (a || 99) - (b || 99));
    h += `<section class="stall" data-stall="${esc(s.id)}">
      <div class="awning" aria-hidden="true"></div>
      <div class="cabinet">
        <header class="cabinet-head">
          <h2><span>${esc(s.name)}</span></h2>
          ${s.blurb ? `<p class="blurb">${esc(s.blurb)}</p>` : ""}
        </header>
        ${tiers.map(t => `<div class="shelf" data-tier="${t || 0}">
          <h3 class="tier-plate"><span>${esc(tierName(t, s))}</span></h3>
          <div class="items">${here.filter(i => tierOf(i) === t).map(card).join("")}</div>
        </div>`).join("")}
      </div>
    </section>`;
  }
  if (!shown.length) h += `<p class="empty">Nothing on the shelves matches “${esc(state.q)}”.</p>`;

  if (LIVE && DATA.warnings && DATA.warnings.length) {
    h += `<details class="notes"><summary>Data notes (${DATA.warnings.length}), shown on the live server only</summary>
      <p>Where data/items.yaml and Ch.10 of the lore-book disagree:</p>
      <ul>${DATA.warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></details>`;
  }
  $("#main").innerHTML = h;
}

/* ---------- an item's slip ---------- */

function power(text) {
  const at = text.indexOf(" — ");
  if (at < 0) return esc(text);
  const rest = text.slice(at + 3);
  return `<b>${esc(text.slice(0, at))}.</b> ${esc(rest.charAt(0).toUpperCase() + rest.slice(1))}`;
}
const itemLink = (item, extra = "") => `<a href="#${esc(item.id)}" data-open="${esc(item.id)}">${esc(item.name)}</a>${extra}`;

function recipe(item) {
  const rows = (item.materials || []).map(([name, qty]) => {
    const m = byName[name], unit = m ? m.market_value : null;
    return `<tr><td>${m ? itemLink(m) : esc(name)}</td><td class="n">× ${num(qty)}</td>
      <td class="n">${esc(cb(unit))}</td><td class="n">${unit == null ? "—" : esc(cb(cents(unit * qty)))}</td></tr>`;
  }).join("");
  const { cost, missing } = recipeCost(item);
  let verdict = "";
  if (missing.length) {
    verdict = `<p class="note">The market doesn't stock ${missing.map(esc).join(", ")}, so the materials cost at least ${esc(cb(cost))}.</p>`;
  } else if (item.market_value != null) {
    const diff = cents(item.market_value - cost);
    verdict = `<p class="note">Bought at the market, the materials come to <b>${esc(cb(cost))}</b>: ${diff > 0
      ? `<b>${esc(cb(diff))} less</b> than buying it made`
      : diff < 0 ? `<b>${esc(cb(-diff))} more</b> than buying it made` : "the same as buying it made"}.</p>`;
  }
  return `<h3>Recipe</h3>
    <table class="recipe"><thead><tr><th>Material</th><th class="n">Qty</th><th class="n">Each</th><th class="n">Cost</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td colspan="3">Materials${missing.length ? " (priced ones)" : ""}</td><td class="n">${esc(cb(cost))}</td></tr></tfoot></table>
    <dl class="facts">
      ${item.tools ? `<dt>Tools</dt><dd>${esc(item.tools)}</dd>` : ""}
      ${item.craft_time_hrs ? `<dt>Craft time</dt><dd>${esc(hours(item.craft_time_hrs))}</dd>` : ""}
    </dl>${verdict}`;
}

function slip(item) {
  const priced = item.market_value != null;
  const from = item.upgrade_from;
  const into = upgradesTo(item);
  const uses = usedIn(item);
  let body = "";
  if (item.stat) body += `<p class="statline">${esc(item.stat)}</p>`;
  if (item.properties && item.properties.length) body += `<p class="props">${item.properties.map(p => `<span>${esc(p)}</span>`).join("")}</p>`;
  if (item.power) body += `<p class="power">${power(item.power)}</p>`;
  if (from || into.length) {
    body += `<h3>Upgrade path</h3><p>`;
    if (from) body += `Upgrades from ${byName[from] ? itemLink(byName[from]) : `${esc(from)} <span class="muted">(not stocked yet)</span>`}. `;
    if (into.length) body += `Upgrades into ${into.map(i => itemLink(i)).join(", ")}.`;
    body += `</p>`;
  }
  if (item.materials && item.materials.length) body += recipe(item);
  const works = worksWith(item);
  if (works.length) body += `<h3>Works</h3><p>${works.map(i => itemLink(i)).join(", ")}.</p>`;
  if (uses.length) {
    body += `<h3>Used in</h3><ul class="uses">${uses.map(i => {
      const qty = i.materials.find(([n]) => n === item.name)[1];
      return `<li>${itemLink(i)} <span class="muted">× ${num(qty)}</span></li>`;
    }).join("")}</ul>`;
  }

  return `<header class="slip-head">
      ${picture(item, "plate big")}
      <div class="slip-title">
        <p class="kicker">${esc(item.category || "")}</p>
        <h2 id="slipTitle">${esc(item.name)}</h2>
        <p class="slip-price">${priced ? `<i class="coin" aria-hidden="true"></i>${esc(cb(item.market_value))}` : `<span class="muted">Not stocked at the Guild market</span>`}</p>
      </div>
      <button class="close" type="button" data-close aria-label="Close"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg></button>
    </header>
    <div class="slip-body">${body}</div>
    <footer class="slip-foot">${priced
      ? `<button class="btn" type="button" data-add="${esc(item.id)}">Add to the tally</button><span class="muted" data-incart="${esc(item.id)}">${inTally(item.id)}</span>`
      : `<span class="muted">Not for sale here: craft it, or ask the DM for a price.</span>`}</footer>`;
}

const inTally = id => tally[id] ? `${tally[id]} on the tally` : "";

// Opened from a tag here: Back (or closing it) returns to the market floor.
let pushed = false;
function showSlip(id) {
  const item = byId[id], dlg = $("#slip");
  if (!item) return dlg.open && dlg.close();
  dlg.innerHTML = slip(item);
  dlg.scrollTop = 0;
  if (!dlg.open) dlg.showModal();
  dlg.querySelector(".close").focus();
}
function closeSlip() {
  if (!byId[location.hash.slice(1)]) return void $("#slip").close();
  if (pushed) {
    pushed = false;
    history.back();
  } else {
    history.replaceState(null, "", location.pathname + location.search);
  }
}
function route() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (byId[id]) showSlip(id);
  else if ($("#slip").open) $("#slip").close();
}

/* ---------- the tally ---------- */

function tallyLines() {
  return Object.entries(tally).filter(([id, n]) => byId[id] && byId[id].market_value != null && n > 0)
    .map(([id, n]) => ({ item: byId[id], n, cost: cents(byId[id].market_value * n) }));
}
function totals() {
  const lines = tallyLines();
  const sub = cents(lines.reduce((s, l) => s + l.cost, 0));
  const factor = market === "local" ? local.markup * (local.scarce ? SCARCE : 1) : 1;
  const priced = cents(sub * factor);
  return { lines, count: lines.reduce((s, l) => s + l.n, 0), sub, factor, priced, due: MARKETS[market].round(priced) };
}

function saveTally() {
  storage("market.tally", JSON.stringify(tally));
  const t = totals();
  $("#tallySum").textContent = t.count ? `${t.count} item${t.count === 1 ? "" : "s"} · ${t.due} CB` : "empty";
  $("#tallyBtn").classList.toggle("has", t.count > 0);
  document.querySelectorAll("[data-incart]").forEach(el => { el.textContent = inTally(el.dataset.incart); });
  if ($("#tally").open) renderTally();
}

function add(id, by = 1) {
  tally[id] = Math.max(0, (tally[id] || 0) + by);
  if (!tally[id]) delete tally[id];
  saveTally();
}

function renderTally() {
  const t = totals(), m = MARKETS[market];
  if (!t.lines.length) {
    $("#tallyBody").innerHTML = `<p class="empty">Nothing on the tally yet. Add items with the <b>+</b> on their tags.</p>`;
    return;
  }
  const [, tu] = COINS.find(c => c[0] === coin);
  const inCoin = t.due / tu;
  $("#tallyBody").innerHTML = `
    <table class="lines">
      <tbody>${t.lines.map(l => `<tr>
        <td>${picture(l.item, "plate tiny")}</td>
        <td class="what">${itemLink(l.item)}<small>${esc(cb(l.item.market_value))} each</small></td>
        <td class="qty"><button type="button" data-dec="${esc(l.item.id)}" aria-label="One fewer">−</button><span>${l.n}</span><button type="button" data-inc="${esc(l.item.id)}" aria-label="One more">+</button></td>
        <td class="n">${esc(cb(l.cost))}</td>
      </tr>`).join("")}</tbody>
    </table>
    <dl class="sum">
      <dt>Subtotal at the Official Value</dt><dd>${esc(cb(t.sub))}</dd>
    </dl>
    <div class="market-kind" role="radiogroup" aria-label="Where you're buying">
      ${Object.entries(MARKETS).map(([k, v]) => `<label><input type="radio" name="mk" value="${k}"${k === market ? " checked" : ""}> ${esc(v.name)}</label>`).join("")}
    </div>
    ${market === "local" ? localControls(t) : ""}
    <p class="rule">${esc(m.rule)}</p>
    <p class="due"><span>To pay</span><b><i class="coin" aria-hidden="true"></i>${t.due} CB</b></p>
    <label class="paying">Paying in
      <select id="coin">${COINS.map(([name, , who]) => `<option value="${esc(name)}"${name === coin ? " selected" : ""}>${esc(name)} · ${esc(who)}</option>`).join("")}</select>
    </label>
    ${coin === "Crownsblood" ? "" : `<p class="rule">That's <b>${num(inCoin)} ${esc(coin)}</b> at the official Trade Unit rate (${num(tu)} TU to the coin). The Guild's changers charge 2–3% on top; district changers may charge a good deal more.</p>`}
    <div class="tally-actions">
      <button class="btn ghost" type="button" id="copyTally">Copy as text</button>
      <button class="btn ghost" type="button" id="clearTally">Clear</button>
    </div>`;
}

function localControls(t) {
  const kind = LOCAL.find(([k]) => k === local.kind);
  return `<div class="local">
      <label>Kind of market
        <select id="localKind">${LOCAL.map(([k, name, x]) => `<option value="${k}"${k === local.kind ? " selected" : ""}>${esc(name)} · × ${x}</option>`).join("")}</select>
      </label>
      <label>Markup ×
        <input id="markup" type="number" min="1" step="0.5" value="${num(local.markup)}" inputmode="decimal">
      </label>
      <label class="check"><input type="checkbox" id="scarce"${local.scarce ? " checked" : ""}> Scarce here (× ${SCARCE}): goods the region brings in from elsewhere</label>
    </div>
    <p class="rule">${esc(cb(t.sub))} × ${num(local.markup)}${kind && kind[2] === local.markup ? ` (${esc(kind[1].toLowerCase())})` : " (haggled)"}${local.scarce ? ` × ${SCARCE} (scarce)` : ""} = <b>${esc(cb(t.priced))}</b></p>`;
}

function saveLocal() {
  storage("market.local", JSON.stringify(local));
  saveTally();
}

function tallyText() {
  const t = totals();
  return `${t.lines.map(l => `${l.n}× ${l.item.name} (${cb(l.cost)})`).join(", ")}. `
    + `Subtotal ${cb(t.sub)}; ${market === "local" ? `local market at × ${num(t.factor)}` : "Guild market"} total ${t.due} CB.`;
}

/* ---------- events ---------- */

$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open], [data-add], [data-stall], [data-tier], [data-inc], [data-dec], [data-close]");
  if (!t) {
    // A click on a dialog's dimmed backdrop (the dialog itself, outside its contents) closes it.
    if (e.target === $("#slip")) closeSlip();
    if (e.target === $("#tally")) $("#tally").close();
    return;
  }
  if (t.dataset.open) {
    e.preventDefault();
    if ($("#tally").open) $("#tally").close();
    if (location.hash.slice(1) === t.dataset.open) return;
    // Within an open slip, hop to the linked item in place of this one.
    if (byId[location.hash.slice(1)]) history.replaceState(null, "", `#${t.dataset.open}`);
    else { history.pushState(null, "", `#${t.dataset.open}`); pushed = true; }
    route();
  } else if (t.dataset.add) {
    add(t.dataset.add);
    t.classList.remove("bump");
    void t.offsetWidth;
    t.classList.add("bump");
  } else if (t.dataset.inc) add(t.dataset.inc);
  else if (t.dataset.dec) add(t.dataset.dec, -1);
  else if (t.dataset.stall) { state.stall = t.dataset.stall; render(); }
  else if (t.dataset.tier) { state.tier = t.dataset.tier; render(); }
  else if (t.dataset.close !== undefined) {
    if (t.closest("#slip")) closeSlip();
    else t.closest("dialog").close();
  }
});
// Esc closes the slip by itself; put the address back to match.
$("#slip").addEventListener("cancel", e => { e.preventDefault(); closeSlip(); });

$("#tallyBtn").addEventListener("click", () => { renderTally(); $("#tally").showModal(); });
$("#tally").addEventListener("change", e => {
  if (e.target.name === "mk") { market = e.target.value; storage("market.kind", market); saveTally(); }
  if (e.target.id === "coin") { coin = e.target.value; storage("market.coin", coin); renderTally(); }
  if (e.target.id === "localKind") { local.kind = e.target.value; local.markup = LOCAL.find(([k]) => k === local.kind)[2]; saveLocal(); }
  if (e.target.id === "markup") { local.markup = Math.max(1, +e.target.value || 1); saveLocal(); }
  if (e.target.id === "scarce") { local.scarce = e.target.checked; saveLocal(); }
});
$("#tally").addEventListener("click", async e => {
  if (e.target.id === "clearTally") { tally = {}; saveTally(); }
  if (e.target.id === "copyTally") {
    try {
      await navigator.clipboard.writeText(tallyText());
      e.target.textContent = "Copied";
    } catch (_) {
      e.target.textContent = "Couldn't copy";
    }
    setTimeout(() => { e.target.textContent = "Copy as text"; }, 1600);
  }
});
addEventListener("popstate", () => { pushed = false; route(); });
addEventListener("hashchange", route);

/* ---------- start ---------- */

try {
  const place = JSON.parse(sessionStorage.getItem("market.place") || "null");
  if (place) {
    sessionStorage.removeItem("market.place");
    Object.assign(state, place.state);
    $("#q").value = state.q;
    requestAnimationFrame(() => scrollTo(0, place.y));
  }
} catch (_) {}
render();
saveTally();
route();

if (LIVE) {
  setInterval(async () => {
    try {
      const { version } = await (await fetch("/version", { cache: "no-store" })).json();
      if (version === DATA.version) return;
      try { sessionStorage.setItem("market.place", JSON.stringify({ state, y: window.scrollY })); } catch (_) {}
      location.reload();
    } catch (_) { /* server stopped or restarting; try again next tick */ }
  }, 1500);
}
</script>
</body>
</html>
