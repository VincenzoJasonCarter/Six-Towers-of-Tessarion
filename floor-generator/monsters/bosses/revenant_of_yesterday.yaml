# Floor 10 boss - the current climb's final fight (the true corrupted
# High Priestess is reserved for a later floor beyond what this climb
# currently models). Temporal identity: time as REPETITION - see the
# Echo/Reversal traits below, both hooked up as real mechanics via
# combat.py/engine.py's "mechanic" trait tag.
#
# An Echo is a genuine extra combatant, not a visual effect - it's
# added to combatants/positions/turn order the same way a swarm
# template's extra bodies are (see monster.py's generate_monster_group),
# just spawned mid-fight instead of at the start. It never moves and
# only ever repeats the one attack the Revenant used the round before
# it was born, so the arena becomes a literal record of past turns.
#
# Kept in monsters/bosses/, not monsters/, so it never turns up as a
# random pick on a non-boss floor - see chronophage.yaml's note.

name: the Revenant of Yesterday
type: Undead (Temporal Revenant)
challenge_rating: 6

base_scores:
  STR: 15
  DEX: 12
  CON: 15
  INT: 8
  WIS: 12
  CHA: 10

hit_dice: 8  # 8d8 - tanky for a boss, but every Echo it leaves behind
             # repeats its full damage, not a fraction of it, so total
             # incoming damage climbs fast once even one is alive -
             # kept lower than the regular roster's CR2 top end (8d8)
             # would otherwise suggest for exactly that reason.
ac_base: 15  # + max(0, DEX modifier)
speed: 9     # meters (30 ft)
proficiency_bonus: 3

traits:
  - name: Echo
    mechanic: revenant_echo
    echo_hp: 10
    description: >
      At the end of every round, the Revenant leaves behind an Echo of
      itself at its current position. The Echo cannot move and repeats
      whichever attack the Revenant used during the previous round -
      the arena slowly fills with its past.
  - name: Reversal
    mechanic: revenant_reversal
    description: >
      (Once per fight) The instant the Revenant is reduced to half its
      hit points or fewer, it swaps places with its oldest surviving
      Echo, forcing the past back to the present.

attacks:
  - name: Axe of Yesterday
    kind: melee
    ability: STR
    damage_dice: 1d12
    damage_type: slashing
    range: 1.5
