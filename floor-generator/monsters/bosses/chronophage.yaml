# Floor 5 boss - a lower-tower miniboss, not yet the corrupted High
# Priestess (she's reserved for a later floor, past what this climb
# currently models). Temporal identity: time as a RESOURCE - see the
# Time Debt/"You Are Already Late" traits below, both hooked up as
# real mechanics (not flavor text) via combat.py/engine.py's
# "mechanic" trait tag, same pattern Flicker Step already uses.
#
# Time Debt is tracked only for the player (never the Chronophage
# itself) - the design is explicitly "whenever a player is hit", one
# directional. "You Are Already Late" is written for a party ("pass
# the mark around") - with a single player in this sim, landing a hit
# on the Chronophage while marked clears the mark instead of handing
# it to a teammate, keeping the intended loop (get marked -> attack
# boss -> pressure resolves) intact solo.
#
# Kept in monsters/bosses/, not monsters/, so it never turns up as a
# random pick on a non-boss floor - list_monster_templates() only
# globs monsters/*.yaml, not subdirectories.

name: the Chronophage
type: Aberration (Temporal Parasite)
challenge_rating: 3

base_scores:
  STR: 14
  DEX: 14
  CON: 15
  INT: 10
  WIS: 14
  CHA: 12

hit_dice: 9  # 9d8
ac_base: 13  # + max(0, DEX modifier)
speed: 9     # meters (30 ft)
proficiency_bonus: 3

traits:
  - name: Time Debt
    mechanic: time_debt
    debt_threshold: 2
    repayment_damage_dice: 2d6
    description: >
      Whenever the Chronophage hits a creature, that creature gains 1
      Time Debt. Once a creature reaches 2 Time Debt, the Chronophage
      may force Repayment on its turn: the debtor loses its next move
      and bonus action, or takes a burst of psychic damage - either
      way, its Time Debt resets to 0.
  - name: You Are Already Late
    mechanic: late_mark
    mark_interval_rounds: 3
    countdown_start: 3
    expiry_damage_dice: 3d6
    description: >
      Every few rounds, the Chronophage marks a creature "Already
      Late." If the mark's countdown reaches 0, time catches up to
      them all at once. Landing a hit on the Chronophage clears the
      mark early - the debt comes due for the Chronophage instead.

attacks:
  - name: Devouring Claw
    kind: melee
    ability: STR
    damage_dice: 1d8
    damage_type: necrotic
    range: 1.5
