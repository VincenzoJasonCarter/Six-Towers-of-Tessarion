# Ranged glass-cannon skirmisher - kites at range and Flicker Steps
# away if the fight closes in. Low HP/AC, high DEX.
#
# DEX trimmed from 18 to 14 in a balance pass against Pijo's AC 12
# (attack_bonus was landing 70-75% to hit) - see the other templates
# for the same pass. Fraying Bolt's damage die had already been hand-
# tuned down to 1d4.

name: Echo-of-Vex
type: Aberration (Timeline Echo)
challenge_rating: 1

base_scores:
  STR: 8
  DEX: 14
  CON: 12
  INT: 10
  WIS: 14
  CHA: 10

hit_dice: 5  # 5d8
ac_base: 12  # + max(0, DEX modifier)
speed: 9     # meters (30 ft)
proficiency_bonus: 2

traits:
  - name: Afterimage
    description: >
      Attack rolls against the creature have disadvantage if it moved
      at least 3 m since the start of its last turn.
  - name: Flicker Step
    mechanic: flicker_step
    description: >
      (Recharge 5-6) As a bonus action, the creature vanishes and
      reappears up to 9 m away.
    recharge: [5, 6]
    range: 9

attacks:
  - name: Fraying Bolt
    kind: ranged_spell
    ability: DEX
    damage_dice: 1d4
    damage_type: force
    range: 6
