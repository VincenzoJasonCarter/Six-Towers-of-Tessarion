backstory: >-
  You were born in the lower districts of Meridian Spire, one of the great human
  towers at the heart of Tessarion. You grew up running errands, slipping
  through crowds, and learning very early that quick hands and quicker feet kept
  you alive. At first you were just another street runner, ferrying notes and
  parcels for servants of the Royal Palace—until one delivery went “wrong” and
  you caught the eye of someone far above your station.


  You were taken into the Palace as a personal assistant to a noble mage: a
  high-born woman who managed royal correspondence, ritual archives, and
  carefully catalogued soulstones. What started as menial work—cleaning desks,
  carrying books, organizing scrolls—slowly turned into something more. She
  taught you to read, to write, to recognize simple sigils, and to survive the
  quiet cruelty of court politics. Somewhere between late-night paperwork and
  shared secrets, respect turned into affection. Affection turned into something
  else.


  You fell in love with your own mistress—and for a brief, dangerous moment, it
  seemed like she returned that feeling. But she was already married, and her
  husband wasn’t just any man; he was a powerful figure in Meridian Spire, with
  more pride than mercy. When the affair was discovered, there was no trial, no
  fair hearing. To avoid scandal, the court chose the easiest solution: you were
  branded the problem. Stripped of position and protection, you were exiled from
  the Palace under cover of night, pushed back into the city with nothing but
  the clothes on your back and the ghost of her touch still on your skin.


  You survived the only way you knew how: stealing. Food from markets, purses
  from drunk nobles, jewelry from distracted merchants—anything that could be
  fenced for a few coins. You learned the rooftops, the blind corners, and the
  guard patrol routes by heart. Resentment toward the highborn festered in your
  chest, mixed with an ache you never fully admitted: you don’t know if you want
  to see her again to ask why… or to watch everything she cares about burn.


  When the time came for the Age-20 crystal rite, nobody expected someone like
  you to matter. You were just another exile, another thief, another failure of
  the system. But when the aether crystal was brought forth and you laid your
  hand on it, it didn’t just glow—it flared. The neutral light fractured into
  shifting prismatic colors, echoing the blood of all four outer races. The
  priests stepped back. The attendants whispered. For a moment, you saw fear in
  their eyes—a fear you had only ever seen directed downward at people like you.


  They called it an omen. A mistake. A danger. But you know the truth: the
  Sangrith-touched soulstone answered you. And ever since that day, when you
  reach for your magic, it feels like reaching into every wound, every betrayal,
  every hunger you’ve ever had and turning it into power.


  Now you live between worlds: part thief, part forbidden Sanguine Mage, an
  exile of Meridian Spire with a grudge, a bleeding heart, and a magic that was
  never meant to belong to someone like you.
