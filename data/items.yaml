# Items of Tessarion: what a character can carry, craft, buy or sell.
#
# The source for the Barracks' item index (barracks/items.py turns it into
# items.json, published at /barracks/items.json for charasheet to read) and
# for the Market (market/), which shows every entry with its price and recipe.
# Entries come from lore-book/07-crafting-book.md (the craftable items, with
# their recipes) and lore-book/10-official-tessarion-market-value.md (prices,
# raw materials, utilities).
#
# id:           stable slug; charasheet may keep it, so don't change it once
#               published (rename the name instead)
# kind:         weapon | shield | armor | ammunition | material | utility | tool | service
# damage:       weapons only. dice, versatile (two-handed dice), bonus (flat,
#               added to damage), type, ability (str | dex: the modifier added
#               to attack and damage; hybrid: attack with the higher of STR
#               and DEX, and add both to damage, the lower only if positive,
#               in place of a bonus. Barracks items.json v1 knows only str and
#               dex, so charasheet must learn hybrid before a Hybrid weapon
#               loses hidden: true)
# properties:   weapons only, as in the stat line
# stat, power:  the rules text from Ch.7
# materials:    recipe as [material name, quantity] pairs (names of entries
#               below, kind: material); tools, craft_time_hrs likewise
# market_value: OTMV in CB from Ch.10, or null where it lists none. Where
#               Ch.10 lists none, a value marked "derived" is worked out:
#               - a crafted item: its materials at market price x 1.1,
#                 rounded the Guild's way (Ch.9: halves up, at least 1 CB),
#                 the rule that gives 11 of the 15 prices Ch.10 does list;
#               - a raw material: the price of the nearest material Ch.10
#                 lists, scaled by how the two compare in real-world prices;
#               - Tier 2 and 3 armour: priced by protection, not materials
#                 (Ch.7, Tier 2 Armor), on 5e's price ratios with the Iron
#                 Sword standing for a longsword (1 CB ~ 4 gp).
# hidden:       true keeps an entry out of items.json (not for players yet)

