# Items of Tessarion: what a character can carry, craft, buy or sell.
#
# The source for the Barracks' item index (barracks/items.py turns it into
# items.json for charasheet to offer in its Weapons and Equipment panels).
# Entries come from lore-book/07-crafting-book.md (the craftable items, with
# their recipes) and lore-book/10-official-tessarion-market-value.md (prices,
# raw materials, utilities).
#
# id:           stable slug; charasheet may keep it, so don't change it once
#               published (rename the name instead)
# kind:         weapon | shield | armor | ammunition | material | utility
# damage:       weapons only. dice, versatile (two-handed dice), bonus (flat,
#               added to damage), type, ability (str | dex: the modifier added
#               to attack and damage)
# properties:   weapons only, as in the stat line
# stat, power:  the rules text from Ch.7
# materials:    recipe as [material name, quantity] pairs (names of entries
#               below, kind: material); tools, craft_time_hrs likewise
# market_value: OTMV in CB from Ch.10, or null where it lists none
# hidden:       true keeps an entry out of items.json (not for players yet)

