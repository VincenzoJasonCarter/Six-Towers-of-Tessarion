<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threadmint Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3ede1;
  --panel: #fbf8f1;
  --ink: #2a241d;
  --muted: #6f6557;
  --rule: #d8cdb8;
  --accent: #8c2f23;
  --accent-soft: #f1ddd5;
  --redact: #2a241d;
  --paper: #fcf8ee;
  --paper-ink: #2b241b;
  --paper-muted: #7d705d;
  --paper-rule: #e3d8c1;
  --wood: #6e4526;
  --wood-hi: #93603a;
  --wood-back: #34200f;
  --brass: #d9bb70;
  --brass-lo: #a9843a;
  --brass-ink: #3a2a10;
  --mark: #f3d77c;
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --display: "Cormorant Garamond", "EB Garamond", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
    --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520; --redact: #e9e1d0;
    --paper: #221e18; --paper-ink: #e6dccb; --paper-muted: #a0947f; --paper-rule: #3b342a;
    --wood: #4d311c; --wood-hi: #6b4629; --wood-back: #1b1109; --mark: #7d6320;
  }
}
:root[data-theme="dark"] {
  --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
  --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520; --redact: #e9e1d0;
  --paper: #221e18; --paper-ink: #e6dccb; --paper-muted: #a0947f; --paper-rule: #3b342a;
  --wood: #4d311c; --wood-hi: #6b4629; --wood-back: #1b1109; --mark: #7d6320;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.6 var(--serif);
}
a { color: var(--accent); }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
.top {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--rule);
}
.brand { text-decoration: none; color: var(--ink); margin-right: auto; }
.brand b { font: 700 26px/1 var(--display); letter-spacing: .01em; }
.brand span { display: block; font-size: 13px; color: var(--muted); font-style: italic; }
.search {
  width: min(320px, 100%); padding: 7px 12px; border: 1px solid var(--rule);
  border-radius: 6px; background: var(--bg); font: 15px var(--sans);
}
.btn, .seg button {
  border: 1px solid var(--rule); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 4px 11px; font: 13px var(--sans); cursor: pointer;
}
.btn:hover, .seg button:hover { border-color: var(--muted); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); position: relative; }
.error {
  max-width: 1200px; margin: 0 auto 24px; padding: 12px 16px; border: 1px solid var(--accent);
  border-radius: 8px; background: var(--accent-soft); font: 14px/1.5 var(--sans); white-space: pre-wrap;
}
.empty { color: var(--muted); font-style: italic; }

/* ---------- front: the library ---------- */
main { padding: 32px 40px 80px; }
.front { max-width: 1240px; margin: 0 auto; }
.intro { max-width: 760px; }
.tier { font: 13px var(--sans); color: var(--muted); letter-spacing: .04em; }
h1 { font: 700 44px/1.1 var(--display); margin: 4px 0 8px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; margin: 22px 0 18px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.key {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule); background: var(--panel);
  border-radius: 999px; padding: 3px 11px 3px 5px; font: 13px var(--sans); cursor: pointer; color: var(--ink);
}
.key i { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
.key.all { padding-left: 11px; }
.options { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.switch { display: flex; align-items: center; gap: 8px; font: 14px var(--sans); color: var(--muted); cursor: pointer; user-select: none; }
.switch input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }
.key[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 600; }

/* A bookcase: wooden frame, a brass nameplate on top, books standing on planks.
   Every spine is exactly --row tall including the headroom above it, so each
   wrapped line of books lands on the next plank of the repeating gradient. */
.cases { display: flex; flex-wrap: wrap; gap: 28px 24px; align-items: flex-start; }
.case {
  flex: 1 1 auto; max-width: 100%;
  --row: 250px; --k: 1; --plank: 22px;
  background: linear-gradient(180deg, rgb(0 0 0 / .35), transparent 40%), var(--wood-back);
  border: 12px solid var(--wood); border-top: 0; border-radius: 4px;
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .45), inset 12px 0 18px -10px rgb(0 0 0 / .6), inset -12px 0 18px -10px rgb(0 0 0 / .6), 0 22px 30px -20px rgb(0 0 0 / .55);
  min-width: 0;
}
.case-head {
  margin: 0 -12px; padding: 7px 12px 8px; text-align: center;
  background: linear-gradient(180deg, var(--wood-hi), var(--wood) 60%, color-mix(in srgb, var(--wood) 75%, black));
  border-radius: 4px 4px 0 0; box-shadow: 0 3px 6px rgb(0 0 0 / .35);
  position: relative; z-index: 1;
}
.plate {
  display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle;
  font: 700 11px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brass-ink);
  padding: 6px 14px; border-radius: 3px;
  background: linear-gradient(180deg, #f0d997, var(--brass) 45%, var(--brass-lo));
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .5), inset 0 -1px 0 rgb(0 0 0 / .2), 0 1px 2px rgb(0 0 0 / .5);
}
.row {
  display: flex; flex-wrap: wrap; align-items: flex-end; column-gap: 2px; row-gap: var(--plank);
  padding: 0 14px var(--plank);
  background: repeating-linear-gradient(180deg,
    transparent 0, transparent var(--row),
    var(--wood-hi) var(--row), var(--wood) calc(var(--row) + 5px),
    color-mix(in srgb, var(--wood) 70%, black) calc(var(--row) + var(--plank)));
}
.spine {
  --w: 44px; --h: 210px;
  position: relative; flex: none; display: flex; flex-direction: column; align-items: center;
  width: calc(var(--w) * var(--k)); height: calc(var(--h) * var(--k));
  margin-top: calc(var(--row) - var(--h) * var(--k));
  padding-top: calc(26px * var(--k)); border-radius: 3px 3px 1px 1px;
  color: #ecd395; text-decoration: none;
  background:
    linear-gradient(90deg, rgb(0 0 0 / .45), rgb(255 255 255 / .16) 14%, rgb(255 255 255 / .05) 38%, rgb(0 0 0 / .06) 68%, rgb(0 0 0 / .45)),
    repeating-linear-gradient(0deg, rgb(255 255 255 / .03) 0 2px, transparent 2px 4px),
    var(--cloth);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .32), 3px 0 5px -2px rgb(0 0 0 / .6);
  transition: transform .18s ease, opacity .25s, filter .25s;
}
.spine.light { color: #2a1d08; }
.spine.banded { box-shadow: inset 0 calc(8px * var(--k)) 0 var(--band), inset 0 0 0 1px rgb(0 0 0 / .32), 3px 0 5px -2px rgb(0 0 0 / .6); }
.spine::before, .spine::after {
  content: ""; position: absolute; left: 4px; right: 4px; height: 5px;
  border-top: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; opacity: .65;
}
.spine::before { top: calc(13px * var(--k)); }
.spine::after { bottom: calc(33px * var(--k)); }
.spine .t {
  writing-mode: vertical-rl; height: calc((var(--h) - 72px) * var(--k)); max-width: calc(100% - 6px);
  overflow: hidden; text-align: center; font: 700 calc(15.5px * var(--k))/1.02 var(--display); letter-spacing: .02em;
  text-shadow: 0 1px 0 rgb(0 0 0 / .35);
}
.spine.light .t { text-shadow: 0 1px 0 rgb(255 255 255 / .25); }
.spine .no { position: absolute; bottom: calc(11px * var(--k)); font: 600 calc(10px * var(--k))/1 var(--sans); letter-spacing: .05em; }
.spine:hover, .spine:focus-visible { transform: translateY(-12px); outline: none; }
.spine:focus-visible { box-shadow: 0 0 0 3px var(--panel), 0 0 0 5px var(--ink); }
.spine.dim { opacity: .22; filter: saturate(.25); }
.bookend {
  flex: none; width: 16px; height: 64px; margin: calc(var(--row) - 64px) 0 0 6px;
  background: linear-gradient(90deg, var(--brass-lo), #f0d997 40%, var(--brass-lo));
  border-radius: 2px 2px 0 0; box-shadow: 2px 0 4px rgb(0 0 0 / .5);
}
.results { margin-top: 36px; max-width: 900px; }
.results h2 { font: 700 28px var(--display); margin: 0 0 10px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
.hits { list-style: none; margin: 0; padding: 0; }
.hits a { display: block; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.hits a:hover { background: var(--panel); }
.hits b { font: 700 21px var(--display); }
.hits small { font: 12.5px var(--sans); color: var(--muted); margin-left: 6px; }
.hits span { display: block; font-size: 16px; color: var(--muted); }
.hits i { display: inline-block; width: 10px; height: 18px; border-radius: 2px; margin-right: 8px; vertical-align: -2px; }
.hits mark, .flow mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

/* ---------- reader ---------- */
#reader { display: none; }
body.reading #reader { display: block; }
body.reading .top, body.reading main { display: none; }
.rbar {
  position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 9px 20px; background: var(--panel); border-bottom: 1px solid var(--rule); font: 14px var(--sans);
}
.rbar .back { text-decoration: none; white-space: nowrap; }
.rtitle { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 240px; }
.rtitle .sw { flex: none; width: 10px; height: 30px; border-radius: 2px; background: var(--cloth); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
.rtitle div { min-width: 0; }
.rtitle b { display: block; font: 700 21px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rtitle small { display: block; color: var(--muted); font-size: 12.5px; }
.rtools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hitbar { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: 6px; background: var(--mark); color: var(--paper-ink); font-size: 13px; }
.hitbar .btn { padding: 2px 8px; background: transparent; border-color: rgb(0 0 0 / .2); color: inherit; }
.toc {
  position: absolute; right: 16px; top: calc(100% + 6px); width: min(400px, calc(100vw - 32px)); max-height: 70vh; overflow-y: auto;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 0;
  box-shadow: 0 16px 36px -12px rgb(0 0 0 / .45);
}
.toc p { margin: 4px 16px 6px; font: 600 12px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toc a { display: block; padding: 5px 16px; text-decoration: none; color: var(--ink); font: 16px/1.3 var(--serif); }
.toc a:hover { background: var(--accent-soft); }
.toc a.l3 { padding-left: 32px; font-size: 14.5px; color: var(--muted); }

.stage { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 22px 12px 6px; }
.turn {
  flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule);
  background: var(--panel); color: var(--ink); font: 26px/1 var(--serif); cursor: pointer; padding: 0 0 3px;
}
.turn:hover:not(:disabled) { border-color: var(--muted); }
.turn:disabled { opacity: .3; cursor: default; }
.book {
  --b: 14px; --tint: color-mix(in oklab, var(--cloth) 78%, black);
  position: relative; flex: none; border-radius: 5px 8px 8px 5px;
  background: repeating-linear-gradient(45deg, rgb(255 255 255 / .035) 0 2px, transparent 2px 5px), var(--cloth);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .3), 0 30px 50px -26px rgb(0 0 0 / .7), 0 3px 8px rgb(0 0 0 / .2);
}
.pbook { --tint: color-mix(in oklab, var(--cloth) 78%, black); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) :is(.book, .pbook) { --tint: color-mix(in oklab, var(--cloth) 50%, white); }
}
:root[data-theme="dark"] :is(.book, .pbook) { --tint: color-mix(in oklab, var(--cloth) 50%, white); }
.sheet { position: absolute; top: var(--b); bottom: var(--b); width: var(--sw); background: var(--paper); }
.sheet.l { left: var(--b); border-radius: 3px 0 0 3px; background: linear-gradient(270deg, rgb(0 0 0 / .17), transparent 26px), var(--paper); box-shadow: -2px 0 0 -0px var(--paper-rule); }
.sheet.r { right: var(--b); border-radius: 0 3px 3px 0; background: linear-gradient(90deg, rgb(0 0 0 / .17), transparent 26px), var(--paper); box-shadow: 2px 0 0 0 var(--paper-rule); }
.book.single .sheet.l { display: none; }
.book.single .sheet.r { background: var(--paper); border-radius: 3px; left: var(--b); right: var(--b); width: auto; box-shadow: none; }
.sheet .rh, .sheet .folio {
  position: absolute; left: var(--o); right: var(--o); text-align: center; color: var(--paper-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sheet .rh { top: calc(var(--head) * .4); font: 600 10.5px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; }
.sheet .folio { bottom: calc(var(--foot) * .36); font: 14px/1 var(--serif); }
.sheet .explate { display: none; }
.sheet.endpaper, .pc-inside .ep {
  background:
    radial-gradient(circle at 30% 30%, rgb(255 255 255 / .13) 0 3px, transparent 3.5px) 0 0 / 22px 22px,
    radial-gradient(circle at 80% 80%, rgb(0 0 0 / .16) 0 2px, transparent 2.5px) 0 0 / 22px 22px,
    linear-gradient(270deg, rgb(0 0 0 / .3), transparent 30px),
    color-mix(in oklab, var(--cloth) 82%, white);
}
.sheet.endpaper .explate, .pc-inside .explate {
  display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 58%; padding: 22px 12px; text-align: center; background: #f7f0de; color: #3b2f1e;
  border: 1px solid #b9a37a; outline: 3px double #b9a37a; outline-offset: -8px; font: italic 15px/1.35 var(--serif);
}
.explate small { display: block; font: 600 10px var(--sans); letter-spacing: .22em; text-transform: uppercase; font-style: normal; }
.explate b { display: block; font: 700 24px/1.1 var(--display); font-style: normal; margin: 6px 0; }
.viewport { position: absolute; left: calc(var(--b) + var(--o)); top: calc(var(--b) + var(--head)); width: var(--vw); height: var(--ph); overflow: hidden; }
.flow {
  position: relative; width: var(--vw); height: var(--ph);
  column-count: var(--n); column-gap: var(--gap); column-fill: auto;
  transition: transform .5s cubic-bezier(.3, .7, .2, 1);
  font-size: var(--fs); line-height: 1.5; color: var(--paper-ink); text-align: justify; hyphens: auto;
}
.scrub { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 8px 16px 20px; font: 13px var(--sans); color: var(--muted); }
.scrub input { width: min(420px, 50vw); accent-color: var(--tint-ui, var(--ink)); }
.scrub .where { min-width: 150px; text-align: center; }
.scrub .turn { display: none; width: 36px; height: 36px; font-size: 22px; }

/* Scroll mode: one long sheet instead of pages. */
.book.scroll { width: min(800px, 100%); }
.book.scroll .sheet { display: none; }
.book.scroll .viewport { position: static; width: auto; height: auto; overflow: visible; margin: var(--b); padding: 36px clamp(18px, 6vw, 64px) 48px; background: var(--paper); border-radius: 3px; }
.book.scroll .flow { width: auto; height: auto; column-count: auto; transform: none !important; transition: none; }
.book.scroll .titlepage { height: auto; padding: 2.5em 0 3em; }
.book.scroll .endspacer, .book.single .endspacer { display: none; }
body.scrollmode .turn, body.scrollmode .scrub { display: none !important; }
body.scrollmode .stage { padding-bottom: 60px; }

/* ---------- inside the book ---------- */
.flow > *:first-child { margin-top: 0; }
.flow p { margin: 0 0 .7em; orphans: 2; widows: 2; }
.flow h1, .flow h2, .flow h3, .flow h4, .flow h5, .flow h6 {
  color: var(--tint); text-align: left; break-after: avoid; break-inside: avoid; scroll-margin-top: 80px;
}
.flow :is(h1, h2, h3, h4, h5, h6) strong { font-weight: inherit; }
.flow h1 { font: 700 1.65em/1.12 var(--display); text-align: center; margin: .9em 0 .6em; }
.flow h2 { font: 700 1.38em/1.15 var(--display); margin: 1em 0 .4em; }
.flow h3 { font: 700 1.16em/1.2 var(--display); margin: .9em 0 .3em; }
.flow h4, .flow h5, .flow h6 { font: 600 .74em/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; margin: 1em 0 .35em; }
.flow hr { border: 0; height: 1.4em; margin: .8em 0; text-align: center; color: var(--tint); overflow: visible; }
.flow hr::after { content: "⁂"; font-size: 1em; line-height: 1.4em; }
.flow blockquote { margin: .8em 0; padding: 0 0 0 .9em; border-left: 3px solid var(--tint); font-style: italic; }
.flow ul, .flow ol { padding-left: 1.25em; margin: 0 0 .7em; text-align: left; }
.flow li { margin-bottom: .2em; }
.flow li > p { margin: 0 0 .3em; }
.flow a { color: var(--tint); }
.flow table { width: 100%; border-collapse: collapse; font-size: .8em; line-height: 1.35; margin: .5em 0 1em; text-align: left; }
.flow th, .flow td { border-bottom: 1px solid var(--paper-rule); padding: .35em .4em; vertical-align: top; overflow-wrap: anywhere; }
.flow th { font-family: var(--sans); font-size: .88em; border-bottom: 2px solid var(--tint); }
.flow tr.band > * { font: 600 .82em/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--tint); padding-top: .9em; border-bottom: 2px solid var(--tint); }
.flow td img[data-ref] { width: 3.2em; margin: 0 auto .3em; }
.flow img[data-ref] { display: block; max-width: 100%; height: auto; margin: .5em auto; border-radius: 3px; }
.flow:not(.flat) img[data-ref] { max-height: calc(var(--ph) - 3.5em); object-fit: contain; }
.flow .figure { text-align: center; margin: .3em 0 .9em; }
.flow .missing { display: block; padding: 1em; border: 1px dashed var(--paper-rule); color: var(--paper-muted); font: italic .85em var(--serif); text-align: center; }
.flow .math { font-family: ui-monospace, Consolas, monospace; font-size: .85em; white-space: nowrap; }
.flow .math.done { font-family: inherit; font-size: 1em; }
.flow code { font-size: .85em; }
.flow .redact { background: var(--redact); color: transparent; border-radius: 2px; user-select: none; }
.flow .opening::first-letter { float: left; font: 700 3.3em/.8 var(--display); padding: .08em .1em 0 0; color: var(--tint); }
.titlepage {
  height: var(--ph); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5em;
  text-align: center; break-after: column; overflow: hidden;
}
.titlepage .lib { font: 600 .66em/1.4 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--paper-muted); }
.titlepage .bt { font: 700 2.2em/1.05 var(--display); color: var(--tint); margin: .3em 0; text-wrap: balance; }
.titlepage .sub { font-style: italic; color: var(--paper-muted); }
.orn { position: relative; width: 7em; height: 1px; background: var(--tint); margin: .6em auto; opacity: .8; }
.orn::after { content: ""; position: absolute; left: 50%; top: 50%; width: 7px; height: 7px; background: var(--tint); transform: translate(-50%, -50%) rotate(45deg); }
.endspacer { height: var(--ph); break-after: column; }
.finis { break-inside: avoid; text-align: center; padding: 2em 0 1em; color: var(--paper-muted); }
.finis p { margin: 0 0 1em; }
.finis a { font: 600 .8em var(--sans); }
.unwritten { text-align: center; color: var(--paper-muted); font-style: italic; margin-top: 30% !important; }
.end-mark { height: 1px; }

/* ---------- taking a book off the shelf ---------- */
body.opening #reader { display: block; position: fixed; inset: 0; z-index: 40; opacity: 0; pointer-events: none; overflow: hidden; }
.pull { position: fixed; inset: 0; z-index: 60; perspective: 2400px; cursor: pointer; }
.pull-bg { position: absolute; inset: 0; background: var(--bg); opacity: 0; }
.pbook { position: absolute; transform-style: preserve-3d; }
.ppages {
  position: absolute; transform: translateZ(-2px); backface-visibility: hidden; border-radius: 0 3px 3px 0;
  background: linear-gradient(90deg, rgb(0 0 0 / .17), transparent 26px), var(--paper); color: var(--paper-ink);
}
.ppages .titlepage { height: 100%; }
.pboard {
  position: absolute; inset: 0; transform: translateZ(-4px); backface-visibility: hidden; border-radius: 3px 8px 8px 3px;
  background: repeating-linear-gradient(45deg, rgb(255 255 255 / .035) 0 2px, transparent 2px 5px), var(--cloth);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .3);
}
.pbook .pspine {
  position: absolute; top: 0; margin: 0; transform-origin: right center; transform: rotateY(-90deg) !important;
  backface-visibility: hidden; transition: none;
}
.pcover { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: left center; }
.pc-front, .pc-inside { position: absolute; inset: 0; backface-visibility: hidden; }
.pc-front {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .3em;
  padding: 14%; text-align: center; color: #ecd395; border-radius: 3px 6px 6px 3px;
  background:
    linear-gradient(90deg, rgb(0 0 0 / .42), rgb(255 255 255 / .1) 2.5%, transparent 6%),
    repeating-linear-gradient(45deg, rgb(255 255 255 / .035) 0 2px, transparent 2px 5px),
    var(--cloth);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / .3), 0 30px 60px -30px rgb(0 0 0 / .75);
}
.pc-front.light { color: #2a1d08; }
.pc-front::before {
  content: ""; position: absolute; inset: 6%; border: 1.5px solid currentColor;
  outline: 1px solid currentColor; outline-offset: .35em; opacity: .55;
}
.pc-front .pc-no { font: 600 .72em/1 var(--sans); letter-spacing: .3em; }
.pc-front .pc-title { font: 700 2.3em/1.05 var(--display); text-wrap: balance; text-shadow: 0 1px 0 rgb(0 0 0 / .3); }
.pc-front.light .pc-title { text-shadow: 0 1px 0 rgb(255 255 255 / .25); }
.pc-front .pc-shelf { font-style: italic; opacity: .85; }
.pc-front .orn, .pc-front .orn::after { background: currentColor; }
.pc-inside { transform: rotateY(180deg); background: var(--cloth); border-radius: 6px 3px 3px 6px; }
.pc-inside .ep { position: absolute; inset: var(--b) 0 var(--b) var(--b); }

/* ---------- narrow screens ---------- */
@media (max-width: 900px) {
  main { padding: 20px 16px 60px; }
  .top { padding: 10px 16px; position: static; }
  .search { width: 100%; }
  h1 { font-size: 36px; }
  .case { --row: 212px; --k: .84; --plank: 18px; border-width: 9px; }
  .case-head { margin: 0 -9px; }
  .bookend { display: none; }
  .rbar { padding: 8px 12px; }
  .stage { padding: 10px 6px 4px; }
  .stage .turn { display: none; }
  .scrub .turn { display: inline-block; }
  .scrub input { width: 40vw; }
  .scrub .where { min-width: 0; }
}
</style>
</head>
<body class="home">
<header class="top">
  <a class="brand" href="#"><b>The Threadmint Library</b><span>The Lore of Tessarion, Shelved by Subject</span></a>
  <input class="search" id="q" type="search" placeholder="Search every volume…" aria-label="Search the library">
</header>
<main id="main"></main>
<div id="reader"></div>

<script>
const DATA = /*__LIBRARY_DATA__*/null;
const LIVE = /*__LIBRARY_LIVE__*/false;  // true when served by serve.py
const KATEX = "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/";

/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const hash = s => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const plural = (n, w, many = w + "s") => `${n} ${n === 1 ? w : many}`;

function roman(n) {
  const R = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let s = "";
  for (const [v, r] of R) while (n >= v) { s += r; n -= v; }
  return s;
}

function luminance(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  if (!m) return 0;
  const [r, g, b] = [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16) / 255)
    .map(c => (c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4));
  return .2126 * r + .7152 * g + .0722 * b;
}

function storage(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (_) { return null; }
}

const books = DATA.books;
const shelves = DATA.shelves;
const shelfById = Object.fromEntries(shelves.map(s => [s.id, s]));
const bySlug = Object.fromEntries(books.map(b => [b.slug, b]));
books.forEach(b => { b._hay = (b.title + " " + b.text).toLowerCase(); });
const shelfOf = b => shelfById[b.shelf] || { id: b.shelf, name: b.shelf, colour: "#7a7166" };
const parentOf = s => (s.part_of && shelfById[s.part_of]) || null;

const state = {
  q: "",
  shelf: null,
  arrange: storage("library.arrange") === "order" ? "order" : "subject",
  mode: storage("library.mode") === "scroll" ? "scroll" : "pages",
  fs: clamp(+storage("library.fs") || 18, 14, 24),
  animate: storage("library.animate") !== "off",
};
const words = () => state.q.toLowerCase().split(/\s+/).filter(w => w.length > 1);
const matches = b => words().every(w => b._hay.includes(w));
const inShelf = b => !state.shelf || b.shelf === state.shelf || shelfOf(b).part_of === state.shelf;

/* ---------- the library ---------- */
// Thicker books for longer chapters; heights vary a little, like a real shelf.
const spineSize = b => ({ w: Math.round(clamp(30 + Math.sqrt(b.words) * .6, 36, 76)), h: 196 + hash(b.slug) % 36 });

function spine(b) {
  const s = shelfOf(b), parent = parentOf(s);
  const { w, h } = spineSize(b);
  const cls = ["spine", luminance(s.colour) > .22 && "light", parent && "banded", !(inShelf(b) && matches(b)) && "dim"].filter(Boolean).join(" ");
  const where = parent ? `${s.name}, ${parent.name}` : s.name;
  return `<a class="${cls}" href="#${esc(b.slug)}" data-slug="${esc(b.slug)}"
    style="--cloth:${esc(s.colour)};--band:${esc(parent ? parent.colour : "transparent")};--w:${w}px;--h:${h}px"
    title="${esc(`${b.title} (Vol. ${roman(b.num)}, ${where})`)}" aria-label="${esc(`Volume ${b.num}: ${b.title}. ${where}.`)}">
    <span class="t">${esc(b.spine)}</span><span class="no">${roman(b.num)}</span></a>`;
}

function bookcase(label, list, id) {
  return `<section class="case" data-group="${esc(id)}" aria-label="${esc(label)}">
    <div class="case-head"><span class="plate">${esc(label)}</span></div>
    <div class="row">${list.map(spine).join("")}<span class="bookend" aria-hidden="true"></span></div></section>`;
}

function bookcases() {
  if (state.arrange === "order") return bookcase("The Complete Lore, in Chapter Order", books, "all");
  return shelves.filter(s => !parentOf(s)).map(g => {
    const ids = new Set(shelves.filter(s => s === g || s.part_of === g.id).map(s => s.id));
    const list = books.filter(b => ids.has(b.shelf));
    return list.length ? bookcase(g.plank || g.name, list, g.id) : "";
  }).join("");
}

function legend() {
  const used = new Set(books.map(b => b.shelf));
  const keys = shelves.filter(s => used.has(s.id) || shelves.some(c => c.part_of === s.id && used.has(c.id)));
  return `<button type="button" class="key all" data-shelf="" aria-pressed="${!state.shelf}">All subjects</button>` +
    keys.map(s => `<button type="button" class="key" data-shelf="${esc(s.id)}" aria-pressed="${state.shelf === s.id}" title="${esc(s.blurb || "")}"><i style="background:${esc(s.colour)}"></i>${esc(s.name)}</button>`).join("");
}

function snippet(b, ws) {
  const lower = b.text.toLowerCase();
  const at = lower.indexOf(ws[0]);
  if (at < 0) return "";
  const a = Math.max(0, b.text.lastIndexOf(" ", Math.max(0, at - 90)) + 1), z = Math.min(b.text.length, at + 140);
  const re = new RegExp(ws.map(w => reEsc(esc(w))).join("|"), "gi");
  return (a ? "…" : "") + esc(b.text.slice(a, z)).replace(re, "<mark>$&</mark>") + (z < b.text.length ? "…" : "");
}

function results() {
  const ws = words();
  if (!ws.length) return "";
  const hits = books.filter(b => inShelf(b) && matches(b));
  if (!hits.length) return `<p class="empty">No volume mentions “${esc(state.q)}”.</p>`;
  return `<h2>Found in ${plural(hits.length, "volume")}</h2><ul class="hits">` + hits.map(b =>
    `<li><a href="#${esc(b.slug)}"><i style="background:${esc(shelfOf(b).colour)}"></i><b>${esc(b.title)}</b><small>Vol. ${roman(b.num)} · ${esc(shelfOf(b).name)}</small><span>${snippet(b, ws)}</span></a></li>`).join("") + "</ul>";
}

function banners() {
  let h = "";
  if (DATA.error) h += `<div class="error">${esc(DATA.error)}\n\nFix the file and save; this page reloads itself.</div>`;
  if (DATA.warnings && DATA.warnings.length) h += `<div class="error">${DATA.warnings.map(esc).join("\n")}</div>`;
  return h;
}

function renderFront() {
  const subjects = new Set(books.map(b => (parentOf(shelfOf(b)) || shelfOf(b)).id)).size;
  return banners() + `<div class="front">
    <div class="intro">
      <p class="tier">THREADMINT LIBRARY · CROWNWEAVE · ACCESS TIER: PUBLIC</p>
      <h1>The Lore of Tessarion</h1>
      <p>Every volume of the lore-book, shelved by subject. A book's binding tells you what it concerns; the key below names each cloth.
      The Weaves of Crownweave share their mother city's case, and each carries a band of Crownweave gold at the head of its spine. Take a volume down to read it.</p>
      <p class="tier">${plural(books.length, "volume")} · ${plural(subjects, "bookcase")}</p>
    </div>
    <div class="controls">
      <div class="legend" role="group" aria-label="Highlight a subject">${legend()}</div>
      <div class="options">
        <label class="switch"><input type="checkbox" id="animate"${state.animate ? " checked" : ""}> Animate books</label>
        <div class="seg" role="group" aria-label="Arrange the books">
          <button type="button" data-arrange="subject" aria-pressed="${state.arrange === "subject"}">By subject</button>
          <button type="button" data-arrange="order" aria-pressed="${state.arrange === "order"}">In chapter order</button>
        </div>
      </div>
    </div>
    <div class="cases ${state.arrange}">${bookcases()}</div>
    <div class="results" id="results">${results()}</div>
  </div>`;
}

/* ---------- the reader ---------- */
let R = null;  // the open book: { b, n, stride, cols, spreads, spread, titleCol, heads, marks }

function whereOf(b) {
  const s = shelfOf(b), parent = parentOf(s);
  return parent ? `${s.name} · ${parent.name}` : s.name;
}

const titlePage = b => `<section class="titlepage">
    <div class="lib">Threadmint Library · Volume ${roman(b.num)}</div>
    <div class="orn"></div>
    <div class="bt">${esc(b.title)}</div>
    <div class="orn"></div>
    <div class="sub">${esc(whereOf(b))}</div>
  </section>`;

const EXPLATE = `<div class="explate"><small>Ex Libris</small><b>Threadmint Library</b>Crownweave</div>`;

function readerHTML(b) {
  const i = books.indexOf(b), next = books[i + 1];
  const where = whereOf(b);
  const body = b.words ? b.html : `<p class="unwritten">The pages of this volume are still blank. Its account has yet to be set down.</p>`;
  return `<div class="rbar">
      <a class="back" href="#">← Library</a>
      <div class="rtitle"><span class="sw"></span><div><b>${esc(b.title)}</b><small>Vol. ${roman(b.num)} · ${esc(where)}</small></div></div>
      <div class="rtools">
        <span class="hitbar" hidden></span>
        <button type="button" class="btn" data-act="toc" aria-expanded="false">Contents</button>
        <div class="seg" role="group" aria-label="Reading mode">
          <button type="button" data-mode="pages" aria-pressed="${state.mode === "pages"}">Pages</button>
          <button type="button" data-mode="scroll" aria-pressed="${state.mode === "scroll"}">Scroll</button>
        </div>
        <div class="seg" role="group" aria-label="Text size">
          <button type="button" data-fs="-1" aria-label="Smaller text">A−</button>
          <button type="button" data-fs="1" aria-label="Larger text">A+</button>
        </div>
      </div>
      <nav class="toc" hidden aria-label="Contents"></nav>
    </div>
    <div class="stage">
      <button type="button" class="turn" data-go="-1" aria-label="Previous page">‹</button>
      <div class="book">
        <div class="sheet l"><span class="rh"></span><span class="folio"></span>${EXPLATE}</div>
        <div class="sheet r"><span class="rh"></span><span class="folio"></span></div>
        <div class="viewport"><div class="flow">
          <div class="endspacer"></div>
          ${titlePage(b)}
          ${body}
          <div class="finis"><div class="orn"></div><p>Here ends <i>${esc(b.title)}</i>.</p>
            ${next ? `<a href="#${esc(next.slug)}">Next: Vol. ${roman(next.num)}, ${esc(next.title)} →</a>` : `<a href="#">Return to the library</a>`}</div>
          <div class="end-mark"></div>
        </div></div>
      </div>
      <button type="button" class="turn" data-go="1" aria-label="Next page">›</button>
    </div>
    <div class="scrub">
      <button type="button" class="turn" data-go="-1" aria-label="Previous page">‹</button>
      <input type="range" min="0" max="0" value="0" aria-label="Turn to page">
      <span class="where"></span>
      <button type="button" class="turn" data-go="1" aria-label="Next page">›</button>
    </div>`;
}

function slugify(t, used) {
  let id = t.toLowerCase().replace(/[’']/g, "").replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "") || "section";
  let k = id, n = 2;
  while (used.has(k)) k = `${id}-${n++}`;
  used.add(k);
  return k;
}

function prepare(flow) {
  // Heading anchors and the contents list.
  const used = new Set();
  const hs = [...flow.querySelectorAll("h1, h2, h3")].filter(h => h.textContent.trim());
  hs.forEach(h => { h.id = slugify(h.textContent.trim(), used); });
  const top = hs.filter(h => h.tagName !== "H3");
  const listed = hs.length <= 40 || top.length < 4 ? hs : top;
  R.heads = top.length ? top : hs;
  $(".toc").innerHTML = `<p>Contents</p><a href="#" data-to="">Title page</a>` + listed.map(h =>
    `<a href="#" data-to="${esc(h.id)}" class="${h.tagName === "H3" && top.length ? "l3" : ""}">${esc(h.textContent.trim())}</a>`).join("");

  // Images come from the pool (static export) or the live server.
  flow.querySelectorAll("img[data-ref]").forEach(img => {
    const src = DATA.images[img.dataset.ref] || (LIVE ? "images/" + img.dataset.ref : "");
    if (!src) {
      img.outerHTML = `<span class="missing">[${esc(img.dataset.ref)} is missing]</span>`;
      return;
    }
    img.loading = "eager";
    img.addEventListener("load", relayoutSoon);
    img.src = src;
  });

  // Google Docs tables use a row with only its first cell filled as a
  // sub-heading ("WEAPONS (TIER I)"); let that cell span the row.
  flow.querySelectorAll("tr").forEach(tr => {
    const [first, ...rest] = tr.children;
    const blank = c => !c.textContent.trim() && !c.querySelector("img");
    if (rest.length && !blank(first) && rest.every(blank)) {
      first.colSpan = rest.length + 1;
      rest.forEach(c => c.remove());
      tr.classList.add("band");
    }
  });

  // Drop cap on the first real paragraph.
  const first = [...flow.children].find(el => el.tagName === "P" && el.textContent.trim().length > 140 && /^[A-Za-z]/.test(el.textContent.trim()));
  if (first) first.classList.add("opening");

  if (flow.querySelector(".math")) {
    if (window.katex) typeset(flow);
    else ensureKatex().then(() => { if (R && R.flow === flow) { typeset(flow); relayoutSoon(); } }, () => {});
  }
  R.marks = highlight(flow);
}

let katexLoading = null;
function ensureKatex() {
  if (!katexLoading) {
    const load = (tag, attrs) => new Promise((ok, fail) => {
      const el = Object.assign(document.createElement(tag), attrs, { onload: ok, onerror: fail });
      document.head.append(el);
    });
    katexLoading = Promise.all([
      load("link", { rel: "stylesheet", href: KATEX + "katex.min.css" }),
      load("script", { src: KATEX + "katex.min.js" }),
    ]);
  }
  return katexLoading;
}

function typeset(root) {
  root.querySelectorAll(".math:not(.done)").forEach(el => {
    try {
      katex.render(el.textContent, el, { throwOnError: false, strict: false });
      el.classList.add("done");
    } catch (_) { /* leave the TeX source showing */ }
  });
}

function highlight(flow) {
  const ws = words();
  if (!ws.length) return [];
  const re = new RegExp(ws.map(reEsc).join("|"), "gi");
  const walker = document.createTreeWalker(flow, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest(".math, .titlepage, .finis, .redact") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT,
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const marks = [];
  for (const node of nodes) {
    const t = node.nodeValue;
    re.lastIndex = 0;
    if (!re.test(t)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(t))) {
      frag.append(t.slice(last, m.index));
      const mk = document.createElement("mark");
      mk.textContent = m[0];
      frag.append(mk);
      marks.push(mk);
      last = m.index + m[0].length;
    }
    frag.append(t.slice(last));
    node.replaceWith(frag);
  }
  return marks;
}

/* Pagination: the text flows through CSS columns exactly one page wide and
   one page tall, so extra pages overflow sideways; turning a page slides the
   strip left by one spread. */
function colOf(el, last) {
  const rects = el.getClientRects();
  if (!rects.length) return null;
  const r = last ? rects[rects.length - 1] : rects[0];
  return Math.max(0, Math.floor((r.left - R.flow.getBoundingClientRect().left + 2) / R.stride));
}

function currentAnchor() {
  if (!R || !R.laidOut) return null;
  const kids = [...R.flow.children];
  if (state.mode === "scroll") {
    const top = $(".rbar").getBoundingClientRect().bottom + 4;
    return kids.find(el => el.getBoundingClientRect().bottom > top) || null;
  }
  const firstCol = R.spread * R.n;
  return kids.find(el => (colOf(el, true) ?? -1) >= firstCol) || null;
}

function layout(target) {
  if (!R) return;
  if (target === undefined) target = currentAnchor();
  const book = $(".book"), flow = R.flow;
  const scroll = state.mode === "scroll";
  document.body.classList.toggle("scrollmode", scroll);
  book.classList.toggle("scroll", scroll);
  flow.classList.toggle("flat", scroll);
  flow.style.setProperty("--fs", state.fs + "px");
  if (scroll) {
    book.removeAttribute("style");
    book.classList.remove("single");
    flow.style.transform = "";
    R.laidOut = true;
    if (target && target !== flow.firstElementChild) target.scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
    updateChrome();
    return;
  }

  const narrow = innerWidth < 700;
  const B = narrow ? 8 : 14, O = narrow ? 20 : 46, I = 34, HEAD = narrow ? 34 : 46, FOOT = narrow ? 34 : 44;
  const stage = $(".stage");
  const availW = stage.clientWidth - (innerWidth <= 900 ? 12 : 2 * 58 + 12);
  const availH = innerHeight - $(".rbar").offsetHeight - $(".scrub").offsetHeight - (narrow ? 16 : 40);
  const n = availW >= 880 ? 2 : 1;
  const ph = Math.round(clamp(availH - 2 * B - HEAD - FOOT, 300, 920));
  const fit = n === 2 ? (availW - 2 * B - 2 * (O + I)) / 2 : availW - 2 * B - 2 * O;
  const pw = Math.floor(Math.max(200, Math.min(fit, ph * .74, state.fs * 34)));
  const gap = n === 2 ? 2 * I : 2 * O;
  const sw = n === 2 ? O + pw + I : O + pw + O;
  const vars = { "--b": B, "--o": O, "--head": HEAD, "--foot": FOOT, "--pw": pw, "--ph": ph, "--gap": gap, "--vw": n * pw + (n - 1) * gap, "--sw": sw };
  book.removeAttribute("style");
  for (const [k, v] of Object.entries(vars)) book.style.setProperty(k, v + "px");
  book.style.setProperty("--n", n);
  book.style.width = 2 * B + n * sw + "px";
  book.style.height = 2 * B + HEAD + ph + FOOT + "px";
  book.classList.toggle("single", n === 1);

  R.n = n;
  R.stride = pw + gap;
  R.titleCol = n === 2 ? 1 : 0;
  flow.style.transition = "none";
  flow.style.transform = "none";
  R.cols = (colOf($(".end-mark", flow)) ?? 0) + 1;
  R.spreads = Math.max(1, Math.ceil(R.cols / n));
  R.headCols = R.heads.map(h => [colOf(h) ?? 0, h.textContent.trim()]);
  R.laidOut = true;
  const col = target ? colOf(target) : 0;
  go(Math.floor((col ?? 0) / n), true);
}

function go(s, instant) {
  if (!R) return;
  if (state.mode === "scroll") return;
  R.spread = clamp(s, 0, R.spreads - 1);
  const flow = R.flow;
  flow.style.transition = instant ? "none" : "";
  flow.style.transform = `translateX(${-R.spread * R.n * R.stride}px)`;
  updateChrome();
  save();
}

const pageNo = c => c - R.titleCol;
function sectionAt(c) {
  let name = R.b.title;
  for (const [hc, t] of R.headCols || []) { if (hc <= c) name = t; else break; }
  return name;
}

function updateChrome() {
  if (!R) return;
  const scroll = state.mode === "scroll";
  document.querySelectorAll(".turn[data-go='-1']").forEach(b => { b.disabled = scroll || R.spread <= 0; });
  document.querySelectorAll(".turn[data-go='1']").forEach(b => { b.disabled = scroll || R.spread >= R.spreads - 1; });
  if (scroll) return;
  const cols = R.n === 2 ? [R.spread * 2, R.spread * 2 + 1] : [R.spread];
  const sheets = R.n === 2 ? [$(".sheet.l"), $(".sheet.r")] : [$(".sheet.r")];
  $(".sheet.l").classList.toggle("endpaper", R.n === 2 && R.spread === 0);
  sheets.forEach((sh, k) => {
    const c = cols[k], front = c <= R.titleCol, blank = c >= R.cols;
    $(".rh", sh).textContent = front || blank ? "" : (R.n === 2 && k === 0 ? R.b.title : sectionAt(c));
    $(".folio", sh).textContent = front || blank ? "" : pageNo(c);
  });
  const total = pageNo(R.cols - 1);
  const shown = cols.filter(c => c > R.titleCol && c < R.cols).map(pageNo);
  $(".scrub .where").textContent = !shown.length ? `Title page · ${plural(Math.max(total, 0), "page")}`
    : shown.length === 2 ? `Pages ${shown[0]}–${shown[1]} of ${total}` : `Page ${shown[0]} of ${total}`;
  const range = $(".scrub input");
  range.max = R.spreads - 1;
  range.value = R.spread;
}

function save() {
  if (!R || !R.laidOut) return;
  const a = currentAnchor();
  if (a) storage("library.at." + R.b.slug, String([...R.flow.children].indexOf(a)));
}

let relayoutTimer = 0;
function relayoutSoon() {
  clearTimeout(relayoutTimer);
  relayoutTimer = setTimeout(() => layout(), 90);
}

function goTo(el) {
  if (!el) return;
  if (state.mode === "scroll") el.scrollIntoView({ block: "start", behavior: "smooth" });
  else go(Math.floor((colOf(el) ?? 0) / R.n));
}

function nextHit() {
  if (!R || !R.marks.length) return;
  let i;
  if (state.mode === "scroll") {
    const y = $(".rbar").getBoundingClientRect().bottom + 10;
    i = R.marks.findIndex(m => m.getBoundingClientRect().top > y + 5);
  } else {
    const lastCol = R.spread * R.n + R.n - 1;
    i = R.marks.findIndex(m => colOf(m) > lastCol);
  }
  goTo(R.marks[i < 0 ? 0 : i]);
}

// hidden: lay the reader out invisibly under the library (see pullOut).
function openBook(b, section, hidden) {
  const s = shelfOf(b);
  if (!hidden) {
    document.body.classList.remove("home", "opening");
    document.body.classList.add("reading");
  }
  const reader = $("#reader");
  reader.style.setProperty("--cloth", s.colour);
  reader.innerHTML = readerHTML(b);
  R = { b, flow: $(".flow", reader), n: 1, stride: 1, cols: 1, spreads: 1, spread: 0, titleCol: 0, heads: [], marks: [], laidOut: false };
  prepare(R.flow);
  document.title = `${b.title} · Threadmint Library`;
  const hits = $(".hitbar");
  if (R.marks.length) {
    hits.hidden = false;
    hits.innerHTML = `${plural(R.marks.length, "match", "matches")} for “${esc(state.q)}” <button type="button" class="btn" data-act="next-hit">Next ↓</button><button type="button" class="btn" data-act="clear-q" aria-label="Clear search">✕</button>`;
  }

  let target = null;
  if (section) target = document.getElementById(section);
  else if (R.marks.length) target = R.marks[0];
  else {
    const at = storage("library.at." + b.slug);
    if (at !== null) target = R.flow.children[+at] || null;
  }
  if (!hidden) window.scrollTo(0, 0);
  layout(target);
}

/* ---------- taking a book off the shelf ----------
   The reader opens invisibly underneath first, so the 3D book knows exactly
   where to land: it slides out of the shelf, flies there turning from spine
   to cover, and opens onto the endpaper and title page the reader shows. */
let pulling = null;   // the animation in progress: { anims, skip, ov }
let libraryY = 0;     // where the library was scrolled when a book was taken
const motionOK = () => state.animate && "animate" in Element.prototype;
const spineK = () => (matchMedia("(max-width: 900px)").matches ? .84 : 1);  // matches .case --k
const at = (x, y, z, sc, ry) => `translate3d(${x}px, ${y}px, ${z}px) scale3d(${sc}, ${sc}, ${sc}) rotateY(${ry}deg)`;

// Where the closed cover sits when the book lies open: the right half of the
// reader's spread, or the whole page on a phone.
function landing() {
  const bookEl = $(".book"), br = bookEl.getBoundingClientRect();
  const B = parseFloat(bookEl.style.getPropertyValue("--b")) || 14;
  const single = bookEl.classList.contains("single");
  let to;
  if (state.mode === "scroll") {
    const h = Math.min(innerHeight * .72, 680), w = Math.min(h * .72, innerWidth * .46);
    to = { left: innerWidth / 2, top: (innerHeight - h) / 2, width: w, height: h };
  } else if (single) to = br;
  else to = { left: br.left + br.width / 2, top: br.top, width: br.width / 2, height: br.height };
  return { to, B, single };
}

// The 3D book: spine, cover (gilt outside, endpaper inside), title page and
// back board, built at its open-book size. sw x sh is the spine on the shelf.
function buildPull(b, sw, sh, k, { to, B, single }) {
  const s = shelfOf(b), parent = parentOf(s), light = luminance(s.colour) > .22;
  const W = to.width, H = to.height, f = H / sh, T = sw * f;
  const ov = document.createElement("div");
  ov.className = "pull";
  ov.innerHTML = `<div class="pull-bg"></div>
    <div class="pbook" style="--cloth:${esc(s.colour)};--b:${B}px;left:${to.left}px;top:${to.top}px;width:${W}px;height:${H}px;font-size:${H / 30}px;transform-origin:50% 50% ${-T / 2}px">
      <div class="pboard"></div>
      <div class="ppages" style="inset:${B}px ${B}px ${B}px ${single ? B : 0}px;font-size:${state.fs}px">${titlePage(b)}</div>
      <div class="spine pspine${light ? " light" : ""}${parent ? " banded" : ""}"
        style="--cloth:${esc(s.colour)};--band:${esc(parent ? parent.colour : "transparent")};--w:${sw / k}px;--h:${sh / k}px;--k:${k * f};left:${-T}px">
        <span class="t">${esc(b.spine)}</span><span class="no">${roman(b.num)}</span></div>
      <div class="pcover">
        <div class="pc-front${light ? " light" : ""}"><div class="pc-no">VOLUME ${roman(b.num)}</div><div class="orn"></div>
          <div class="pc-title">${esc(b.title)}</div><div class="orn"></div><div class="pc-shelf">${esc(whereOf(b))}</div></div>
        <div class="pc-inside"><div class="ep">${EXPLATE}</div></div>
      </div>
    </div>`;
  const me = pulling = { anims: [], skip: false, ov };
  ov.addEventListener("click", () => { me.skip = true; me.anims.forEach(a => a.finish()); });
  const run = (el, frames, ms, easing, delay = 0) => {
    const a = el.animate(frames, { duration: me.skip ? 0 : ms, delay: me.skip ? 0 : delay, easing, fill: "forwards" });
    me.anims.push(a);
    return a.finished;
  };
  // Where the book stands on the shelf, relative to its open position. Turned
  // spine-on, the spine sits W/2 in front of the pivot, hence the z shift.
  const shelved = from => {
    const s0 = sh / H, dx = from.left + sw / 2 - (to.left + W / 2), dy = from.top + sh / 2 - (to.top + H / 2);
    return { home: at(dx, dy, -W / 2 * s0, s0, 90), lifted: at(dx, dy - sh * .1, -W / 2 * s0, s0 * 1.14, 90) };
  };
  return { me, ov, run, shelved, pb: $(".pbook", ov), cover: $(".pcover", ov), bg: $(".pull-bg", ov) };
}

// Taking a book down: the reader opens invisibly underneath first, so the 3D
// book knows exactly where to land. It slides off the shelf, flies there
// turning from spine to cover, and opens onto the endpaper and title page.
async function pullOut(sp) {
  const b = bySlug[sp.dataset.slug];
  if (!b) return;
  const from = sp.getBoundingClientRect();
  const k = parseFloat(getComputedStyle(sp).getPropertyValue("--k")) || 1;
  libraryY = window.scrollY;
  lastBook = b.slug;
  history.pushState(null, "", "#" + b.slug);
  document.body.classList.add("opening");
  openBook(b, null, true);

  const { me, ov, run, shelved, pb, cover, bg } = buildPull(b, from.width, from.height, k, landing());
  const { home, lifted } = shelved(from);
  document.body.append(ov);
  sp.style.visibility = "hidden";
  try {
    await run(pb, [{ transform: home }, { transform: lifted }], 320, "cubic-bezier(.2, .7, .3, 1)");
    await Promise.all([
      run(pb, [{ transform: lifted }, { transform: at(0, 0, 0, 1, 0) }], 760, "cubic-bezier(.5, 0, .2, 1)"),
      run(bg, [{ opacity: 0 }, { opacity: 1 }], 600, "ease"),
    ]);
    await run(cover, [{ transform: "rotateY(0deg)" }, { transform: "rotateY(-180deg)" }], 760, "cubic-bezier(.45, .05, .25, 1)", 60);
    if (pulling !== me) return;
    document.body.classList.remove("opening", "home");
    document.body.classList.add("reading");
    window.scrollTo(0, 0);
    layout();
    await run(ov, [{ opacity: 1 }, { opacity: 0 }], 260, "ease");
  } catch (_) {
    return;  // cancelled by abortPull()
  }
  ov.remove();
  if (pulling === me) pulling = null;
}

// Putting it back is the same film run backwards: the open book fades in over
// the page, the library is laid out underneath, and the book closes, turns
// spine-on and slides back into its gap.
async function putBack(b) {
  const k = spineK(), { w, h } = spineSize(b);
  const { me, ov, run, shelved, pb, cover, bg } = buildPull(b, w * k, h * k, k, landing());
  cover.style.transform = "rotateY(-180deg)";
  bg.style.opacity = 1;
  ov.style.opacity = 0;
  document.body.append(ov);
  let sp = null;
  try {
    await run(ov, [{ opacity: 0 }, { opacity: 1 }], 220, "ease");
    if (pulling !== me) return;
    showLibrary();
    window.scrollTo(0, libraryY);
    sp = document.querySelector(`.spine[data-slug="${CSS.escape(b.slug)}"]`);
    if (!sp) throw new Error("no spine");
    const r = sp.getBoundingClientRect();
    if (r.top < 0 || r.bottom > innerHeight) sp.scrollIntoView({ block: "center" });
    sp.style.visibility = "hidden";
    const { home, lifted } = shelved(sp.getBoundingClientRect());
    await run(cover, [{ transform: "rotateY(-180deg)" }, { transform: "rotateY(0deg)" }], 680, "cubic-bezier(.45, .05, .25, 1)");
    await Promise.all([
      run(pb, [{ transform: at(0, 0, 0, 1, 0) }, { transform: lifted }], 760, "cubic-bezier(.5, 0, .2, 1)"),
      run(bg, [{ opacity: 1 }, { opacity: 0 }], 640, "ease", 80),
    ]);
    await run(pb, [{ transform: lifted }, { transform: home }], 300, "cubic-bezier(.4, 0, .6, 1)");
  } catch (_) {
    if (pulling === me) { ov.remove(); pulling = null; render(); }
    return;  // cancelled by abortPull(), or the spine is gone
  }
  sp.style.visibility = "";
  ov.remove();
  if (pulling === me) pulling = null;
  sp.focus({ preventScroll: true });
}

// Navigating mid-animation (Back, Esc, live reload) drops it on the spot.
function abortPull() {
  if (!pulling) return;
  pulling.anims.forEach(a => a.cancel());
  if (pulling.ov) pulling.ov.remove();
  pulling = null;
  document.body.classList.remove("opening");
}

/* ---------- routing ---------- */
let lastBook = null;
const hashBook = () => bySlug[decodeURIComponent(location.hash.slice(1)).split("/")[0]];

function render() {
  const [slug, section] = decodeURIComponent(location.hash.slice(1)).split("/");
  const b = bySlug[slug];
  if (b) {
    lastBook = b.slug;
    openBook(b, section);
    return;
  }
  showLibrary();
}

function showLibrary() {
  R = null;
  document.body.classList.remove("reading", "scrollmode", "opening");
  document.body.classList.add("home");
  $("#reader").innerHTML = "";
  $("#main").innerHTML = renderFront();
  document.title = "Threadmint Library";
}

function refreshFront() {
  const y = window.scrollY;
  $("#main").innerHTML = renderFront();
  window.scrollTo(0, y);
}

window.addEventListener("hashchange", () => {
  abortPull();
  if (R && R.laidOut && !hashBook() && motionOK() && document.body.classList.contains("reading")) {
    putBack(R.b);
    return;
  }
  const wasReading = !!R;
  render();
  if (!R && wasReading && lastBook) {
    const sp = document.querySelector(`.spine[data-slug="${CSS.escape(lastBook)}"]`);
    if (sp) { sp.scrollIntoView({ block: "center" }); sp.focus({ preventScroll: true }); }
  }
});

const qBox = document.getElementById("q");
qBox.addEventListener("input", () => { state.q = qBox.value; refreshFront(); });

document.addEventListener("click", ev => {
  const t = ev.target;
  if (pulling || t.closest(".pull")) return;
  const sp = t.closest("a.spine");
  if (sp && ev.button === 0 && !(ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.altKey) && motionOK()) {
    ev.preventDefault();
    pullOut(sp);
    return;
  }
  const key = t.closest(".key");
  if (key) { state.shelf = key.dataset.shelf || null; refreshFront(); return; }
  const arr = t.closest("[data-arrange]");
  if (arr) { state.arrange = arr.dataset.arrange; storage("library.arrange", state.arrange); refreshFront(); return; }
  if (!R) return;

  const toc = $(".toc");
  const act = t.closest("[data-act]")?.dataset.act;
  if (act === "toc") {
    toc.hidden = !toc.hidden;
    $("[data-act='toc']").setAttribute("aria-expanded", !toc.hidden);
    return;
  }
  if (!toc.hidden && !t.closest(".toc")) { toc.hidden = true; $("[data-act='toc']").setAttribute("aria-expanded", "false"); }
  if (act === "next-hit") return nextHit();
  if (act === "clear-q") { state.q = qBox.value = ""; openBook(R.b); return; }
  const to = t.closest("[data-to]");
  if (to) {
    ev.preventDefault();
    toc.hidden = true;
    goTo(to.dataset.to ? document.getElementById(to.dataset.to) : R.flow.firstElementChild);
    if (!to.dataset.to && state.mode === "scroll") window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const turn = t.closest("[data-go]");
  if (turn) return go(R.spread + +turn.dataset.go);
  const mode = t.closest("[data-mode]");
  if (mode && mode.dataset.mode !== state.mode) {
    const a = currentAnchor();
    state.mode = mode.dataset.mode;
    storage("library.mode", state.mode);
    document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === state.mode));
    layout(a);
    return;
  }
  const fs = t.closest("[data-fs]");
  if (fs) {
    const a = currentAnchor();
    state.fs = clamp(state.fs + +fs.dataset.fs, 14, 24);
    storage("library.fs", String(state.fs));
    layout(a);
    return;
  }
  // Tap the outer part of the page to turn it on touch screens.
  if (state.mode === "pages" && t.closest(".viewport") && !t.closest("a, button") && matchMedia("(pointer: coarse)").matches) {
    const r = $(".viewport").getBoundingClientRect(), x = (ev.clientX - r.left) / r.width;
    if (x > .66) go(R.spread + 1);
    else if (x < .34) go(R.spread - 1);
  }
});

document.addEventListener("input", ev => {
  if (ev.target.id === "animate") {
    state.animate = ev.target.checked;
    storage("library.animate", state.animate ? "on" : "off");
  }
  if (R && ev.target.matches(".scrub input")) go(+ev.target.value);
});

document.addEventListener("keydown", ev => {
  if (!R || ev.target.closest("input, textarea") || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  if (ev.key === "Escape") {
    const toc = $(".toc");
    if (!toc.hidden) { toc.hidden = true; return; }
    location.hash = "";
    return;
  }
  if (state.mode !== "pages") return;
  const step = { ArrowRight: 1, PageDown: 1, " ": 1, ArrowLeft: -1, PageUp: -1 }[ev.key];
  if (step) { ev.preventDefault(); go(R.spread + (ev.shiftKey && ev.key === " " ? -1 : step)); }
  else if (ev.key === "Home") { ev.preventDefault(); go(0); }
  else if (ev.key === "End") { ev.preventDefault(); go(R.spreads - 1); }
});

let touchX = null;
document.addEventListener("touchstart", ev => { touchX = ev.target.closest(".viewport") ? ev.touches[0].clientX : null; }, { passive: true });
document.addEventListener("touchend", ev => {
  if (!R || touchX === null || state.mode !== "pages") return;
  const dx = ev.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(R.spread + (dx < 0 ? 1 : -1));
  touchX = null;
});

let resizeTimer = 0, scrollTimer = 0;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (R && state.mode === "pages") layout(); }, 120);
});
window.addEventListener("scroll", () => {
  if (!R || state.mode !== "scroll") return;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(save, 250);
}, { passive: true });
if (document.fonts) document.fonts.ready.then(() => { if (R) layout(); });

// Live mode: reload when a chapter / catalogue / template changes, keeping
// the search, highlighted subject and scroll position across the reload.
let place = null;
try {
  place = JSON.parse(sessionStorage.getItem("library.place"));
  sessionStorage.removeItem("library.place");
} catch (_) {}
if (place) {
  state.q = qBox.value = place.q || "";
  state.shelf = shelfById[place.shelf] ? place.shelf : null;
}
render();
if (place && !R) window.scrollTo(0, place.y || 0);

if (LIVE) {
  setInterval(async () => {
    try {
      const { version } = await (await fetch("/version", { cache: "no-store" })).json();
      if (version === DATA.version) return;
      save();
      try { sessionStorage.setItem("library.place", JSON.stringify({ q: state.q, shelf: state.shelf, y: window.scrollY })); } catch (_) {}
      location.reload();
    } catch (_) { /* server stopped or restarting; try again next tick */ }
  }, 1500);
}
</script>
</body>
</html>
