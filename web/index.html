<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Threadmint</title>
<meta name="description" content="The lore of Tessarion and the Threadmint Bestiary.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3ede1; --panel: #fbf8f1; --ink: #2a241d; --muted: #6f6557;
  --rule: #d8cdb8; --accent: #8c2f23; --accent-soft: #f1ddd5;
  --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  --display: "Cormorant Garamond", "EB Garamond", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
    --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520;
  }
}
:root[data-theme="dark"] {
  --bg: #15120e; --panel: #1d1a15; --ink: #e9e1d0; --muted: #a39884;
  --rule: #3a332a; --accent: #e0826c; --accent-soft: #3b2520;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--ink); font: 1.125rem/1.5 var(--serif);
  padding: 48px 16px;
}
main { width: 100%; max-width: 760px; text-align: center; }
h1 { font: 700 clamp(2.2rem, 7vw, 3.4rem)/1.05 var(--display); margin: 0; }
.sub { color: var(--muted); font-style: italic; margin: 8px 0 40px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.door {
  display: block; padding: 28px 24px; text-align: left; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--rule); border-top: 4px solid var(--accent);
  border-radius: 6px; transition: transform .15s, box-shadow .15s;
}
.door:hover, .door:focus-visible { transform: translateY(-2px); box-shadow: 0 8px 24px rgb(0 0 0 / .12); outline: none; }
.door b { display: block; font: 700 1.7rem/1.1 var(--display); color: var(--accent); }
.door span { display: block; margin-top: 8px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>The Threadmint</h1>
  <p class="sub">Records of the Six Towers of Tessarion</p>
  <nav class="doors">
    <a class="door" href="library/"><b>The Library</b><span>The lore of Tessarion, shelved by subject.</span></a>
    <a class="door" href="bestiary/"><b>The Bestiary</b><span>A register of hostile things within the Union.</span></a>
  </nav>
</main>
</body>
</html>
