[project]
name = "floor-generator"
version = "0.1.0"
description = "Add your description here"
readme = "floor-generator/README.md"
authors = [
    { name = "VincenzoJasonCarter", email = "pijojc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pygame>=2.6.1",
    "pyyaml>=6.0.3",
    "resvg-py>=0.5.0",
]

[project.scripts]
floor-generator = "floor_generator.cli:main"
dnd-sim = "floor_generator.dnd.cli:main"
dnd-gui = "floor_generator.dnd.gui:main"
dnd-run = "floor_generator.dnd.run:main"
map-segmenter = "floor_generator.worldmap.cli:main"

[tool.uv.build-backend]
module-root = "floor-generator/src"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
